name: TV-Programmdaten aktualisieren

on:
  schedule:
    - cron: '23 3 * * *'    # täglich ca. 04:23 MEZ
    - cron: '23 15 * * *'   # und ca. 16:23 MEZ
  workflow_dispatch:         # manuell: Actions → „TV-Programmdaten aktualisieren“ → Run workflow

permissions:
  contents: write

concurrency:
  group: epg
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Programmdaten laden und umwandeln
        run: python3 scripts/update_epg.py
      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/epg.json
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -m "TV-Programmdaten aktualisiert"
          git push
