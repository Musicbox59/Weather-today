  /* leichte Bildröhren-Zeilen + Abdunklung für gut lesbare Schrift */
  header::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px),linear-gradient(90deg,rgba(15,20,30,.15),rgba(15,20,30,.35))}
  h1,.chip{text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .chip.on{text-shadow:none}
  .chip{backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  .top{display:flex;align-items:center;gap:8px}
  h1{font-size:18px;margin:0;flex:1;white-space:nowrap}
  .icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
  .icon-btn:hover{background:rgba(255,255,255,.12)}
  .icon-btn svg{width:22px;height:22px}
  .row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:8px;padding-bottom:2px}
  .row::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.1);color:#dfe6f1;font-size:13px;white-space:nowrap}
  .chip:hover{background:rgba(255,255,255,.18)}
  .chip.on{background:#fff;color:#1b2433;font-weight:600}
  .chip.jump{background:transparent;border:1px solid rgba(255,255,255,.25)}
  .chip.prime{border-color:var(--accent);color:#fff;background:rgba(61,123,253,.25)}

  /* Raster */
  #scroller{flex:1;overflow:auto;position:relative;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scroll-behavior:auto}
  #grid{display:grid;min-width:100%;width:max-content}
  .corner,.ch-head{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line-hour);height:46px}
  .corner{left:0;z-index:7;display:grid;place-items:center;font-size:11px;color:var(--muted);border-right:1px solid var(--line)}
  .ch-head{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:14px;border-right:1px solid var(--line);padding:0 6px}
  .ch-badge{width:10px;height:10px;border-radius:3px;flex:none}
  .times{position:sticky;left:0;z-index:4;background:var(--panel);border-right:1px solid var(--line)}
  .times span{position:absolute;right:6px;transform:translateY(-50%);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .times span.h{font-weight:700;color:var(--text);font-size:12px}
  .times span:first-child{transform:none}
  .col{position:relative;border-right:1px solid var(--line);
       background-image:repeating-linear-gradient(to bottom,var(--line-hour) 0 1px,transparent 1px calc(var(--px)*30),var(--line) calc(var(--px)*30) calc(var(--px)*30 + 1px),transparent calc(var(--px)*30 + 1px) calc(var(--px)*60))}
  .prog{position:absolute;left:3px;right:3px;background:var(--block);border-radius:6px;padding:4px 7px 4px 9px;overflow:hidden;cursor:pointer;

function hash(str){ let h = 2166136261; for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h>>>0; }
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed>>>15, 1 | seed); t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t; return ((t ^ t>>>14)>>>0) / 4294967296; }; }
function shuffled(arr, r){ const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

const cache = {};
function schedule(chId, date){
  const key = chId + '|' + dateKey(date);
  if(cache[key]) return cache[key];
  const ch = CHANNELS[chId], r = rng(hash(key)), year = date.getFullYear();

  const idx = {film:0,doku:0,serie:0,show:0,kids:0,sport:0};
  const take = t => pools[t][idx[t]++ % pools[t].length];
  const list = ch.slots.map((s, i) => {
    const start = toMin(s[0]);
    const end = i < ch.slots.length-1 ? toMin(ch.slots[i+1][0]) : DAY_START + DAY_LEN;
    let p;
    if(typeof s[1] === 'object'){
      p = {...s[1], year, country: ch.country.split('/')[0]};
    } else if(s[1] === 'film'){
      const f = take('film'); p = {title:f[0], genre:f[1], year:f[2], country:f[3], rating:f[4], desc:f[5], cat:'film', cast:(FILM_EXTRA[f[0]]||[])[0], review:(FILM_EXTRA[f[0]]||[])[1]};
    } else if(s[1] === 'doku'){
      const d = take('doku'); p = {title:d[0], genre:d[1], year:d[2], country:d[3], desc:d[4], cat:'doku'};
    } else if(s[1] === 'serie' || s[1] === 'kids'){
      const d = take(s[1]); const st = 1 + Math.floor(r()*Math.max(1, year - d[2])), ep = 1 + Math.floor(r()*12);
      p = {title:d[0], genre:d[1], year:d[2], country:d[3], desc:d[4], cat:s[1], episode:`Staffel ${st}, Folge ${ep}`};
      if(s[1] === 'serie'){ const rr = rng(hash(d[0])); p.cast = [0,1,2].map(() => [FIRST[Math.floor(rr()*FIRST.length)] + ' ' + LAST[Math.floor(rr()*LAST.length)], '']); p.review = SERIES_REVIEW[d[1]] || SERIES_REVIEW.default; }
    } else {
      const d = take(s[1]); p = {title:d[0], genre:d[1], year, country:d[2], desc:d[3], cat:s[1]};
    }
    return {...p, start, end, ch:chId};
  });
  return cache[key] = list;
}

let order = store.get('tv.channels', DEFAULT_ORDER).filter(id => CHANNELS[id]);
if(!order.length) order = DEFAULT_ORDER.slice();
let dayOffset = 0;
const scroller = $('#scroller'), grid = $('#grid');

function broadcastDate(off){
  // Vor 05:00 gehört die Sendung noch zum Vortag
  const d = new Date(); if(d.getHours()*60 + d.getMinutes() < DAY_START) d.setDate(d.getDate()-1);
  d.setDate(d.getDate()+off); d.setHours(12,0,0,0); return d;
}
function nowMinute(){
  const d = new Date(); let m = d.getHours()*60 + d.getMinutes(); if(m < DAY_START) m += 1440; return m;
}
const yFor = m => (m - DAY_START) * PX_PER_MIN;

/* ===================== Rendering ===================== */
function renderDays(){
  const wd = ['So','Mo','Di','Mi','Do','Fr','Sa'];
  $('#days').innerHTML = Array.from({length:7}, (_, i) => {
    const d = broadcastDate(i);
    const label = i===0 ? 'Heute' : i===1 ? 'Morgen' : `${wd[d.getDay()]} ${d.getDate()}.${d.getMonth()+1}.`;
    return `<button class="chip ${i===dayOffset?'on':''}" data-day="${i}">${label}</button>`;
  }).join('');
}
function renderJumps(){
  const j = [['Jetzt','now'],['Früh','06:00'],['Mittag','12:00'],['Vorabend','18:00'],['20:15','20:15'],['22:00','22:00'],['Nacht','00:00']];
  $('#jumps').innerHTML = j.map(([l,v]) => `<button class="chip jump ${v==='20:15'?'prime':''}" data-jump="${v}">${l}</button>`).join('');
}

function renderGrid(){
  const date = broadcastDate(dayOffset);
  const H = DAY_LEN * PX_PER_MIN;
  const isToday = dayOffset === 0, now = nowMinute();
  grid.style.gridTemplateColumns = `52px repeat(${order.length}, minmax(152px, 1fr))`;
  document.documentElement.style.setProperty('--px', PX_PER_MIN + 'px');

  let html = `<div class="corner">${date.getDate()}.${date.getMonth()+1}.</div>`;
  html += order.map(id => `<div class="ch-head"><span class="ch-badge" style="background:${CHANNELS[id].color}"></span>${esc(CHANNELS[id].name)}</div>`).join('');

  // Zeitachse
  let t = `<div class="times" style="height:${H}px">`;
  for(let m = DAY_START; m < DAY_START + DAY_LEN; m += 30){
    t += `<span class="${m%60===0?'h':''}" style="top:${yFor(m)}px">${fmt(m)}</span>`;
  }
  html += t + '</div>';

  // Spalten
  for(const id of order){
    let c = `<div class="col" style="height:${H}px">`;
    for(const p of schedule(id, date)){
      const h = (p.end - p.start) * PX_PER_MIN;
      const live = isToday && now >= p.start && now < p.end, past = isToday && now >= p.end;
      const dur = p.end - p.start;
      const size = h < 36 ? 'short tiny' : h < 64 ? 'short' : '';
      const meta = `<span class="g">${esc(p.genre)}</span> · ${esc(p.country)} ${p.year}`;
      c += `<div role="button" tabindex="0" class="prog ${size} ${live?'live':''} ${past?'past':''}" style="top:${yFor(p.start)+1}px;height:${h-2}px;--cat:${CATS[p.cat].color}"
              data-ch="${id}" data-start="${p.start}">
              <div class="t">${fmt(p.start)} – ${fmt(p.end)}${live?'<b>LIVE</b>':''}</div>
              <div class="ti">${esc(p.title)}</div>
              ${h >= 64 ? `<div class="m">${meta}</div>` : ''}
              ${p.rating && h >= 84 ? starsHtml(p.rating) : ''}
            </div>`;
    }
    c += `<div class="marker" style="top:${yFor(PRIME)}px"></div>`;
    if(isToday) c += `<div class="nowline" style="top:${yFor(now)}px"></div>`;
    html += c + '</div>';
  }
  grid.innerHTML = html;
}

function scrollToMin(m, smooth){
  scroller.scrollTo({top: Math.max(0, yFor(m) - 8), behavior: smooth ? 'smooth' : 'auto'});
}

function trailerUrl(p){

}
function quettaUrl(url){

}

  const SONG_URLS = ['media/amsel.mp3', 'https://www.join4all.com/media/amsel.mp3'];

  const canVol = (() => { try { const t = new Audio(); t.volume = 0.5; return Math.abs(t.volume - 0.5) < 0.01; } catch (e) { return false; } })();
  const showState = () => btn.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
  showState();

  function ensureAudio() {
    if (!audio) {
      audio = new Audio(SONG_URLS[0]); audio.preload = 'auto';
      audio.addEventListener('error', () => {
        if (++songIdx < SONG_URLS.length) { audio.src = SONG_URLS[songIdx]; audio.load(); } else audioFailed = true;
      });
    }
    return audio;
  }
  function unlock() {
    if (unlocked) return;

    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    const a = ensureAudio(); a.muted = true;
    const pr = a.play();
    const done = () => { if (!a.__singing) a.pause(); a.muted = false; };
    if (pr && pr.then) pr.then(done, () => { a.muted = false; }); else done();
    ['click', 'touchend', 'keydown', 'pointerup'].forEach(ev => removeEventListener(ev, unlock, true));
  }
  ['click', 'touchend', 'keydown', 'pointerup'].forEach(ev => addEventListener(ev, unlock, true));

    fadeTimer = setInterval(() => { audio.volume = Math.max(0, audio.volume - 0.08); if (audio.volume <= 0.02) { clearInterval(fadeTimer); audio.pause(); } }, 40);
  }
  // Ersatz, falls die Tondatei nicht geladen werden kann: flötende Amsel-Strophe per Web Audio
  function synthPhrase(sec) {
    if (!actx) return;
    if (actx.state === 'suspended') actx.resume();
    let t = actx.currentTime + 0.05; const end = t + sec;
    while (t < end - 0.3) {
      const n = 3 + Math.floor(Math.random() * 4);
      for (let i = 0; i < n; i++) {
        const o = actx.createOscillator(), g = actx.createGain(), d = 0.12 + Math.random() * 0.22;
        const f0 = 1400 + Math.random() * 1300, f1 = f0 * (0.8 + Math.random() * 0.5);
        o.type = 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + d);
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.12, t + 0.03); g.gain.exponentialRampToValueAtTime(0.001, t + d);
        o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d + 0.02);
        t += d + 0.04;
      }
      for (let i = 0; i < 5; i++) {   // leises Zwitschern am Strophenende
        const o = actx.createOscillator(), g = actx.createGain();
        o.frequency.setValueAtTime(4200 + Math.random() * 1500, t); o.frequency.exponentialRampToValueAtTime(3000, t + 0.05);
        g.gain.setValueAtTime(0.04, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
        o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.07); t += 0.07;
      }
      t += 0.6;
    }
  }
  function playPhrase(p) {
    if (!soundOn || !unlocked) return;
    if (audioFailed) { synthPhrase(Math.min(p[1] - p[0], 4)); return; }
    const a = ensureAudio();
    clearTimeout(stopTimer); clearInterval(fadeTimer);
    const go = () => {
      try { a.currentTime = p[0]; } catch (e) {}
      a.muted = false; a.__singing = true;
      if (canVol) a.volume = 0.05;
      const pr = a.play();
      if (pr && pr.catch) pr.catch(() => { a.__singing = false; });
      if (canVol) fadeTimer = setInterval(() => { a.volume = Math.min(VOL, a.volume + 0.07); if (a.volume >= VOL) clearInterval(fadeTimer); }, 40);
      stopTimer = setTimeout(() => stopSound(false), (p[1] - p[0]) * 1000);
    };
    if (a.readyState >= 1) go(); else a.addEventListener('loadedmetadata', go, { once: true });
  }

  let firstPress = true;
  btn.addEventListener('click', () => {
    unlock();
    if (firstPress && soundOn) firstPress = false;   // erster Klick bei Ton an: nicht ausschalten, sondern singen
    else { firstPress = false; soundOn = !soundOn; }
    showState(); store.set('tv.amsel', soundOn);
    if (!soundOn) { stopSound(true); return; }
    if (state.mode === 'sit') { bird.classList.remove('singing'); sing(); }
  });

  /* --- Sitzplätze: Kopfbereich, Senderköpfe, Trennstriche zwischen Sendungen, Ratgeber-Button --- */
  function inside(r, box) { return r.right > box.left && r.left < box.right && r.bottom > box.top && r.top < box.bottom; }
  function candidates() {
    const list = [], s = size(), vw = innerWidth;
    const headEls = [$('header h1'), $('#btnBird'), $('#btnTheme'), $('#btnChannels'), ...document.querySelectorAll('#days .chip, #jumps .chip')];
    for (const el of headEls) {
      const r = el.getBoundingClientRect(), row = el.closest('.row');
      if (r.width < 30 || r.top - s.h * 0.925 < 0) continue;   // muss ganz im Bild sitzen
      if (row && (r.left < row.getBoundingClientRect().left || r.right > row.getBoundingClientRect().right)) continue;
      if (r.right > vw || r.left < 0) continue;
      list.push({ el, w: 3 });
    }
    for (const el of document.querySelectorAll('.ch-head')) {
      const r = el.getBoundingClientRect();
      if (r.left >= 52 && r.right <= vw) list.push({ el, w: 1 });
    }
    // Trennstriche zwischen Sendungen = Oberkante der sichtbaren Programmblöcke
    const sr = scroller.getBoundingClientRect();
    const box = { left: sr.left + 52, right: sr.right, top: sr.top + 46 + s.h, bottom: sr.bottom - 8 };
    for (const el of grid.querySelectorAll('.prog')) {
      const r = el.getBoundingClientRect();
      if (r.top >= box.top && r.top <= box.bottom && r.left >= box.left && r.right <= box.right) list.push({ el, w: 2 });
    }
    const fab = $('#btnTips');
    if (fab.getBoundingClientRect().width) list.push({ el: fab, w: 1 });
    return list;
  }
  function pickTarget() {
    const c = candidates().filter(x => x.el !== state.el);
    if (!c.length) return null;
    const tot = c.reduce((a, x) => a + x.w, 0); let r = Math.random() * tot;
    for (const x of c) { r -= x.w; if (r <= 0) return x.el; }
    return c[c.length - 1].el;
  }

  /* --- Bewegung --- */
  const state = { mode: 'away', el: null, frac: 0.5, x: -120, y: 40, facingLeft: false };
  let flight = null, timers = [], running = false;
  const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); return t; };
  const clearLater = () => { timers.forEach(clearTimeout); timers = []; };
  const rnd = (a, b) => a + Math.random() * (b - a);
  const size = () => ({ w: bird.offsetWidth, h: bird.offsetHeight });

  function perch(el, frac) {
    if (!el || !el.isConnected) return null;
    const r = el.getBoundingClientRect(), s = size();
    if (!r.width) return null;
    return { x: r.left + frac * r.width - s.w / 2, y: r.top - s.h * 0.925, r };
  }
  function stillVisible(el) {
    const p = perch(el, 0.5); if (!p) return false;
    if (el.classList.contains('prog')) {
      const sr = scroller.getBoundingClientRect();
      return p.r.top >= sr.top + 46 && p.r.top <= sr.bottom - 4 && p.r.left >= sr.left + 40 && p.r.right <= sr.right + 10;
    }
    const row = el.closest('.row');
    if (row) { const rr = row.getBoundingClientRect(); if (p.r.left < rr.left - 10 || p.r.right > rr.right + 10) return false; }
    return p.r.right > 0 && p.r.left < innerWidth && p.r.top > 0;
  }
  function place(x, y, tilt) {
    state.x = x; state.y = y;
    bird.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
    tiltEl.style.transform = `rotate(${(tilt || 0).toFixed(1)}deg)`;
  }
  function face(left) { state.facingLeft = left; bird.classList.toggle('left', left); }

  function flyTo(el, frac, away) {
    clearLater(); stopSound(false);
    bird.classList.remove('sitting', 'singing', 'peck', 'look');
    bird.classList.add('flying');
    state.mode = 'fly';
    const x0 = state.x, y0 = state.y;
    const end = away || !el ? { x: Math.random() < 0.5 ? -140 : innerWidth + 140, y: rnd(0, innerHeight * 0.4) } : perch(el, frac);
    const dist = Math.hypot(end.x - x0, end.y - y0);
    flight = { el, frac, away: away || !el, x0, y0, end, t0: performance.now(), dur: Math.max(900, Math.min(3200, dist / 0.42)), lift: rnd(70, 150) };
    face(end.x < x0);
    state.el = flight.away ? null : el; state.frac = frac;
  }
  function land() {
    bird.classList.remove('flying'); bird.classList.add('sitting');
    state.mode = 'sit'; tiltEl.style.transform = 'rotate(0deg)';
    later(sing, rnd(500, 1400));
    later(fidget, rnd(2600, 4000));
    later(next, rnd(9000, 14000));
  }
  function sing() {
    if (state.mode !== 'sit') return;
    const p = PHRASES[Math.floor(Math.random() * PHRASES.length)];
    const dur = Math.min((p[1] - p[0]) * 1000, 7400);
    bird.classList.add('singing');
    playPhrase(p);
    let n = 0; const iv = setInterval(() => { note(); if (++n > dur / 450) clearInterval(iv); }, 450);
    timers.push(iv);
    later(() => { bird.classList.remove('singing'); clearInterval(iv); }, dur);
  }
  function fidget() {
    if (state.mode !== 'sit' || bird.classList.contains('singing')) { later(fidget, 1500); return; }
    const r = Math.random();
    if (r < 0.3) face(!state.facingLeft);
    else if (r < 0.55) { bird.classList.add('peck'); later(() => bird.classList.remove('peck'), 380); }
    else if (r < 0.8) { bird.classList.add('look'); later(() => bird.classList.remove('look'), 900); }
    else { bird.classList.remove('hopping'); void bird.offsetWidth; bird.classList.add('hopping');
           state.frac = Math.min(0.85, Math.max(0.15, state.frac + (state.facingLeft ? -0.08 : 0.08))); }
    later(fidget, rnd(1600, 3200));
  }
  function next() {
    if (Math.random() < 0.12) { flyTo(null, 0.5, true); return; }   // kurz wegfliegen …
    flyTo(pickTarget(), rnd(0.2, 0.8), false);
  }
  function note() {
    const s = size(), el = document.createElement('span');
    el.className = 'bird-note';
    const bx = state.facingLeft ? state.x + s.w * 0.08 : state.x + s.w * 0.86;
    el.style.left = (bx - 8) + 'px'; el.style.top = (state.y - 6) + 'px';
    el.style.setProperty('--dx', ((state.facingLeft ? -1 : 1) * rnd(8, 26)).toFixed(0) + 'px');
    el.style.setProperty('--rot', rnd(-25, 25).toFixed(0) + 'deg');
    el.innerHTML = Math.random() < 0.5
      ? '<svg viewBox="0 0 16 20"><path d="M11 1v12.5a3.2 3.2 0 1 1-2-3V4.5L15 3V1z" fill="currentColor"/></svg>'
      : '<svg viewBox="0 0 16 20"><path d="M5 3l10-2v12a3 3 0 1 1-2-2.8V5L7 6.2V15a3 3 0 1 1-2-2.8z" fill="currentColor"/></svg>';
    layer.appendChild(el);
    setTimeout(() => el.remove(), 1900);
  }
  function frame(now) {
    if (!running) return;
    if (state.mode === 'fly' && flight) {
      const f = flight;
      if (!f.away) { const pe = perch(f.el, f.frac); if (pe) f.end = pe; }   // Ziel folgt beim Scrollen
      const t = Math.min(1, (now - f.t0) / f.dur);
      const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      const cx = (f.x0 + f.end.x) / 2, cy = Math.min(f.y0, f.end.y) - f.lift, u = 1 - e;
      const x = u * u * f.x0 + 2 * u * e * cx + e * e * f.end.x;
      const y = u * u * f.y0 + 2 * u * e * cy + e * e * f.end.y;
      const dy = 2 * u * (cy - f.y0) + 2 * e * (f.end.y - cy);
      place(x, y, Math.max(-22, Math.min(22, dy / 12)) * (f.end.x < f.x0 ? -1 : 1));
      if (t >= 1) {
        flight = null;
        if (f.away) { state.mode = 'away'; bird.classList.remove('flying'); later(next, rnd(4000, 8000)); }
        else land();
      }
    } else if (state.mode === 'sit') {
      if (!stillVisible(state.el)) next();     // Sitzplatz weggescrollt oder neu gezeichnet → auffliegen
      else { const p = perch(state.el, state.frac); place(state.x + (p.x - state.x) * 0.3, p.y, 0); }
    }
    requestAnimationFrame(frame);
  }
  function setRunning(on) {
    if (on === running) return;
    running = on;
    if (on) requestAnimationFrame(frame); else stopSound(true);
  }

  bird.querySelector('.hit').addEventListener('click', ev => {
    ev.stopPropagation(); unlock();
    if (state.mode === 'sit' && !bird.classList.contains('singing')) sing();
  });
  document.addEventListener('visibilitychange', () => setRunning(!document.hidden));

  if (reduced) {   // ohne Bewegung: sitzt ruhig auf dem Titel und singt auf Klick
    state.el = $('#jumps .prime'); state.frac = 0.6; state.mode = 'sit';
    const pos = () => { const q = perch(state.el, state.frac); if (q) place(q.x, q.y, 0); };
    pos(); bird.classList.add('sitting', 'ready'); addEventListener('resize', pos);
    return;
  }
  place(-120, 30, 0);
  bird.classList.add('ready');
  setRunning(true);
  later(() => flyTo($('#jumps .prime'), 0.6, false), 1200);
})();

/* ===================== Start ===================== */
renderDays(); renderJumps(); renderGrid();
scrollToMin(PRIME);   // Standard: Ausschnitt ab 20:15
</script>
</body>
