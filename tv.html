<style>

    --now:#e5383b; --star:#f2a900; --star-off:#cfd5de; --shadow:0 1px 2px rgba(20,30,50,.08);

    --px:4px; /* Pixel pro Minute */
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#10141b; --panel:#171d27; --head:#0b0f15; --text:#e6eaf0; --muted:#94a0b2; --line:#252d3a; --line-hour:#344052;
      --block:#1b2230; --block-hover:#222b3c; --star-off:#3d4757; --shadow:none;
    }
  }
  :root[data-theme="dark"]{
    --bg:#10141b; --panel:#171d27; --head:#0b0f15; --text:#e6eaf0; --muted:#94a0b2; --line:#252d3a; --line-hour:#344052;
    --block:#1b2230; --block-hover:#222b3c; --star-off:#3d4757; --shadow:none;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}

  /* Kopfbereich */
  header{background:var(--head);color:var(--head-text);padding:calc(8px + env(safe-area-inset-top)) 12px 8px;flex:none}
  .top{display:flex;align-items:center;gap:8px}
  h1{font-size:18px;margin:0;flex:1;white-space:nowrap}
  .icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
  .icon-btn:hover{background:rgba(255,255,255,.12)}
  .icon-btn svg{width:22px;height:22px}
  .row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:8px;padding-bottom:2px}
  .row::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.1);color:#dfe6f1;font-size:13px;white-space:nowrap}
  .chip:hover{background:rgba(255,255,255,.18)}
  .chip.on{background:#fff;color:#1b2433;font-weight:600}
  .chip.jump{background:transparent;border:1px solid rgba(255,255,255,.25)}
  .chip.prime{border-color:var(--accent);color:#fff;background:rgba(61,123,253,.25)}

  #scroller{flex:1;overflow:auto;position:relative;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scroll-behavior:auto}
  #grid{display:grid;min-width:100%;width:max-content}
  .corner,.ch-head{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line-hour);height:46px}
  .corner{left:0;z-index:7;display:grid;place-items:center;font-size:11px;color:var(--muted);border-right:1px solid var(--line)}
  .ch-head{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:14px;border-right:1px solid var(--line);padding:0 6px}
  .ch-badge{width:10px;height:10px;border-radius:3px;flex:none}
  .times{position:sticky;left:0;z-index:4;background:var(--panel);border-right:1px solid var(--line)}
  .times span{position:absolute;right:6px;transform:translateY(-50%);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .times span.h{font-weight:700;color:var(--text);font-size:12px}
  .times span:first-child{transform:none}
  .col{position:relative;border-right:1px solid var(--line);
       background-image:repeating-linear-gradient(to bottom,var(--line-hour) 0 1px,transparent 1px calc(var(--px)*30),var(--line) calc(var(--px)*30) calc(var(--px)*30 + 1px),transparent calc(var(--px)*30 + 1px) calc(var(--px)*60))}
  .prog{position:absolute;left:3px;right:3px;background:var(--block);border-radius:6px;padding:4px 7px 4px 9px;overflow:hidden;cursor:pointer;
        box-shadow:var(--shadow);border:1px solid var(--line);text-align:left;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;width:auto;transition:background .12s}
  .prog::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cat)}
  .prog:hover{background:var(--block-hover)}
  .prog.live{border-color:var(--now);box-shadow:0 0 0 1px var(--now) inset}
  .prog.past{opacity:.55}
  .prog .t{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .prog .t b{color:var(--now);font-weight:700;margin-left:4px}
  .prog .ti{font-weight:700;font-size:13.5px;line-height:1.2;margin:1px 0 2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .prog .m{font-size:11.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .prog .g{color:var(--cat);font-weight:600}
  .prog.short{padding-top:2px;padding-bottom:2px}
  .prog.short .ti{-webkit-line-clamp:1;font-size:12px;margin:0}
  .prog.tiny .t{display:none}
  .stars{font-size:13px;letter-spacing:1px;line-height:1;display:inline-block;
         background:linear-gradient(90deg,var(--star) calc(var(--r)/5*100%),var(--star-off) 0);-webkit-background-clip:text;background-clip:text;color:transparent}
  .prog .stars{margin-top:3px;align-self:flex-start}
  .nowline{position:absolute;left:0;right:0;height:2px;background:var(--now);z-index:3;pointer-events:none}
  .nowline::before{content:"";position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--now)}
  .marker{position:absolute;left:0;right:0;border-top:2px dashed var(--accent);opacity:.5;z-index:2;pointer-events:none}

  .note{flex:none;font-size:11px;color:var(--muted);text-align:center;padding:4px 10px calc(4px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}

  /* Detail-Blatt & Dialog */
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
  .backdrop.open{display:flex}
  .sheet{background:var(--panel);color:var(--text);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));
         max-height:85vh;overflow:auto;animation:up .2s ease-out}
  @media (min-width:640px){.backdrop{align-items:center}.sheet{border-radius:18px}}
  @keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
  .sheet h2{margin:4px 0 6px;font-size:21px;line-height:1.2}
  .sheet .sub{color:var(--muted);font-size:13px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
  .tag{padding:4px 10px;border-radius:999px;background:var(--bg);font-size:13px}
  .tag.cat{background:var(--cat);color:#fff;font-weight:600}
  .sheet .stars{font-size:22px}
  .sheet p{margin:10px 0 0;line-height:1.5}
  .close{float:right;width:34px;height:34px;border-radius:50%;background:var(--bg);font-size:20px;line-height:1}
  .ch-list{list-style:none;margin:12px 0 0;padding:0}
  .ch-list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .ch-list label{flex:1;display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
  .ch-list input{width:20px;height:20px;accent-color:var(--accent)}
  .mv{width:32px;height:32px;border-radius:8px;background:var(--bg)}
  .mv:disabled{opacity:.3;cursor:default}
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;font-size:12px;color:var(--muted)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
</style>
</head>

// Zusätzliche Sender, die man in der Senderverwaltung einblenden kann
const GENERIC = [['05:00','serie'],['07:00','show'],['09:00','serie'],['11:00','doku'],['12:30','serie'],['14:00','show'],['15:30','serie'],['17:00','show'],
  ['18:00','serie'],['19:00','show'],['20:15','film'],['22:15','serie'],['23:10','film'],['01:00','serie'],['02:00','doku'],['03:00','show'],['04:00','serie']];
Object.assign(CHANNELS, {
  dreisat:{name:'3sat', color:'#6a4c93', country:'Deutschland/Österreich/Schweiz', slots:GENERIC.map(s=>s[1]==='show'?[s[0],'doku']:s)},
  puls4:{name:'PULS 4', color:'#219ebc', country:'Österreich', slots:GENERIC},
  atv:{name:'ATV', color:'#d00000', country:'Österreich', slots:GENERIC},
  srf1:{name:'SRF 1', color:'#9d0208', country:'Schweiz', slots:GENERIC},
  rtl:{name:'RTL', color:'#e63946', country:'Deutschland', slots:GENERIC},
  vox:{name:'VOX', color:'#ef476f', country:'Deutschland', slots:GENERIC},
});
const DEFAULT_ORDER = ['orf1','orf2','orf3','servus','arte','bayern','zdf','ard'];

/* ===================== Hilfsfunktionen ===================== */
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
function hash(str){ let h = 2166136261; for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h>>>0; }
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed>>>15, 1 | seed); t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t; return ((t ^ t>>>14)>>>0) / 4294967296; }; }
function shuffled(arr, r){ const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const toMin = hm => { const [h,m] = hm.split(':').map(Number); let v = h*60+m; return v < DAY_START ? v + 1440 : v; }; // nach Mitternacht -> Folgetag
const fmt = m => { m = ((m % 1440) + 1440) % 1440; return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0'); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dateKey = d => d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
const starsHtml = r => `<span class="stars" style="--r:${r}" role="img" aria-label="Kritik: ${String(r).replace('.',',')} von 5 Sternen">★★★★★</span>`;

/* Programm eines Senders für einen Sendetag erzeugen (deterministisch je Datum) */
const cache = {};
function schedule(chId, date){
  const key = chId + '|' + dateKey(date);
  if(cache[key]) return cache[key];
  const ch = CHANNELS[chId], r = rng(hash(key)), year = date.getFullYear();
  const pools = { film:shuffled(FILMS,r), doku:shuffled(DOCS,r), serie:shuffled(SERIES,r), show:shuffled(SHOWS,r), kids:shuffled(KIDS,r), sport:shuffled(SPORT,r) };
  const idx = {film:0,doku:0,serie:0,show:0,kids:0,sport:0};
  const take = t => pools[t][idx[t]++ % pools[t].length];
  const list = ch.slots.map((s, i) => {
    const start = toMin(s[0]);
    const end = i < ch.slots.length-1 ? toMin(ch.slots[i+1][0]) : DAY_START + DAY_LEN;
    let p;
    if(typeof s[1] === 'object'){
      p = {...s[1], year, country: ch.country.split('/')[0]};
    } else if(s[1] === 'film'){
      const f = take('film'); p = {title:f[0], genre:f[1], year:f[2], country:f[3], rating:f[4], desc:f[5], cat:'film'};
    } else if(s[1] === 'doku'){
      const d = take('doku'); p = {title:d[0], genre:d[1], year:d[2], country:d[3], desc:d[4], cat:'doku'};
    } else if(s[1] === 'serie' || s[1] === 'kids'){
      const d = take(s[1]); const st = 1 + Math.floor(r()*Math.max(1, year - d[2])), ep = 1 + Math.floor(r()*12);
      p = {title:d[0], genre:d[1], year:d[2], country:d[3], desc:d[4], cat:s[1], episode:`Staffel ${st}, Folge ${ep}`};
    } else {
      const d = take(s[1]); p = {title:d[0], genre:d[1], year, country:d[2], desc:d[3], cat:s[1]};
    }
    return {...p, start, end, ch:chId};
  });
  return cache[key] = list;
}

/* ===================== Zustand ===================== */
let order = store.get('tv.channels', DEFAULT_ORDER).filter(id => CHANNELS[id]);
if(!order.length) order = DEFAULT_ORDER.slice();
let dayOffset = 0;
const scroller = $('#scroller'), grid = $('#grid');

function broadcastDate(off){
  // Vor 05:00 gehört die Sendung noch zum Vortag
  const d = new Date(); if(d.getHours()*60 + d.getMinutes() < DAY_START) d.setDate(d.getDate()-1);
  d.setDate(d.getDate()+off); d.setHours(12,0,0,0); return d;
}
function nowMinute(){
  const d = new Date(); let m = d.getHours()*60 + d.getMinutes(); if(m < DAY_START) m += 1440; return m;
}
const yFor = m => (m - DAY_START) * PX_PER_MIN;

/* ===================== Rendering ===================== */
function renderDays(){
  const wd = ['So','Mo','Di','Mi','Do','Fr','Sa'];
  $('#days').innerHTML = Array.from({length:7}, (_, i) => {
    const d = broadcastDate(i);
    const label = i===0 ? 'Heute' : i===1 ? 'Morgen' : `${wd[d.getDay()]} ${d.getDate()}.${d.getMonth()+1}.`;
    return `<button class="chip ${i===dayOffset?'on':''}" data-day="${i}">${label}</button>`;
  }).join('');
}
function renderJumps(){
  const j = [['Jetzt','now'],['Früh','06:00'],['Mittag','12:00'],['Vorabend','18:00'],['20:15','20:15'],['22:00','22:00'],['Nacht','00:00']];
  $('#jumps').innerHTML = j.map(([l,v]) => `<button class="chip jump ${v==='20:15'?'prime':''}" data-jump="${v}">${l}</button>`).join('');
}

function renderGrid(){
  const date = broadcastDate(dayOffset);
  const H = DAY_LEN * PX_PER_MIN;
  const isToday = dayOffset === 0, now = nowMinute();
  grid.style.gridTemplateColumns = `52px repeat(${order.length}, minmax(152px, 1fr))`;
  document.documentElement.style.setProperty('--px', PX_PER_MIN + 'px');

  let html = `<div class="corner">${date.getDate()}.${date.getMonth()+1}.</div>`;
  html += order.map(id => `<div class="ch-head"><span class="ch-badge" style="background:${CHANNELS[id].color}"></span>${esc(CHANNELS[id].name)}</div>`).join('');

  // Zeitachse
  let t = `<div class="times" style="height:${H}px">`;
  for(let m = DAY_START; m < DAY_START + DAY_LEN; m += 30){
    t += `<span class="${m%60===0?'h':''}" style="top:${yFor(m)}px">${fmt(m)}</span>`;
  }
  html += t + '</div>';

  // Spalten
  for(const id of order){
    let c = `<div class="col" style="height:${H}px">`;
    for(const p of schedule(id, date)){
      const h = (p.end - p.start) * PX_PER_MIN;
      const live = isToday && now >= p.start && now < p.end, past = isToday && now >= p.end;
      const dur = p.end - p.start;
      const size = h < 36 ? 'short tiny' : h < 64 ? 'short' : '';
      const meta = `<span class="g">${esc(p.genre)}</span> · ${esc(p.country)} ${p.year}`;
      c += `<div role="button" tabindex="0" class="prog ${size} ${live?'live':''} ${past?'past':''}" style="top:${yFor(p.start)+1}px;height:${h-2}px;--cat:${CATS[p.cat].color}"
              data-ch="${id}" data-start="${p.start}">
              <div class="t">${fmt(p.start)} – ${fmt(p.end)}${live?'<b>LIVE</b>':''}</div>
              <div class="ti">${esc(p.title)}</div>
              ${h >= 64 ? `<div class="m">${meta}</div>` : ''}
              ${p.rating && h >= 84 ? starsHtml(p.rating) : ''}
            </div>`;
    }
    c += `<div class="marker" style="top:${yFor(PRIME)}px"></div>`;
    if(isToday) c += `<div class="nowline" style="top:${yFor(now)}px"></div>`;
    html += c + '</div>';
  }
  grid.innerHTML = html;
}

function scrollToMin(m, smooth){
  scroller.scrollTo({top: Math.max(0, yFor(m) - 8), behavior: smooth ? 'smooth' : 'auto'});
}

function openDetail(chId, start){
  const p = schedule(chId, broadcastDate(dayOffset)).find(x => x.start === start);
  if(!p) return;
  const ch = CHANNELS[chId], d = broadcastDate(dayOffset);
  const dayTxt = d.toLocaleDateString('de-AT', {weekday:'long', day:'numeric', month:'long'});
  $('#detailBody').innerHTML = `
    <button class="close" data-close aria-label="Schließen">×</button>
    <div class="sub"><span class="ch-badge" style="display:inline-block;background:${ch.color};margin-right:6px"></span>${esc(ch.name)} · ${dayTxt}</div>
    <h2>${esc(p.title)}</h2>
    <div class="sub">${fmt(p.start)} – ${fmt(p.end)} Uhr · ${p.end - p.start} Min.${p.episode ? ' · ' + p.episode : ''}</div>
    <div class="tags" style="--cat:${CATS[p.cat].color}">
      <span class="tag cat">${esc(p.genre)}</span>
      <span class="tag">📅 ${p.year}</span>
      <span class="tag">🌍 ${esc(p.country)}</span>
    </div>
    ${p.rating ? `<div>Kritik: ${starsHtml(p.rating)} <span class="sub">${String(p.rating).replace('.',',')}/5</span></div>` : ''}
    <p>${esc(p.desc)}</p>`;
  $('#detail').classList.add('open');
}

function renderChannelList(){
  const all = [...order, ...Object.keys(CHANNELS).filter(id => !order.includes(id))];
  $('#chList').innerHTML = all.map(id => {
    const on = order.includes(id), i = order.indexOf(id);
    return `<li>
      <label><input type="checkbox" data-toggle="${id}" ${on?'checked':''}>
        <span class="ch-badge" style="background:${CHANNELS[id].color}"></span>${esc(CHANNELS[id].name)}</label>
      <button class="mv" data-up="${id}" ${!on||i===0?'disabled':''} aria-label="nach links">▲</button>
      <button class="mv" data-down="${id}" ${!on||i===order.length-1?'disabled':''} aria-label="nach rechts">▼</button>
    </li>`;
  }).join('');
  $('#legend').innerHTML = Object.values(CATS).map(c => `<span><i style="background:${c.color}"></i>${c.label}</span>`).join('');
}
function saveOrder(){
  store.set('tv.channels', order);
  const top = scroller.scrollTop; renderGrid(); scroller.scrollTop = top; renderChannelList();
}

/* ===================== Events ===================== */
$('#days').addEventListener('click', e => {
  const b = e.target.closest('[data-day]'); if(!b) return;
  dayOffset = +b.dataset.day; const top = scroller.scrollTop;
  renderDays(); renderGrid(); scroller.scrollTop = top;
});
$('#jumps').addEventListener('click', e => {
  const b = e.target.closest('[data-jump]'); if(!b) return;
  if(b.dataset.jump === 'now'){
    if(dayOffset !== 0){ dayOffset = 0; renderDays(); renderGrid(); }
    scrollToMin(nowMinute() - 30, true);
  } else scrollToMin(toMin(b.dataset.jump), true);
});
grid.addEventListener('click', e => {
  const b = e.target.closest('.prog'); if(b) openDetail(b.dataset.ch, +b.dataset.start);
});
document.querySelectorAll('.backdrop').forEach(bd => bd.addEventListener('click', e => {
  if(e.target === bd || e.target.closest('[data-close]')) bd.classList.remove('open');
}));
grid.addEventListener('keydown', e => {
  const b = e.target.closest('.prog'); if(b && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); openDetail(b.dataset.ch, +b.dataset.start); }
});
document.addEventListener('keydown', e => { if(e.key === 'Escape') document.querySelectorAll('.backdrop.open').forEach(b => b.classList.remove('open')); });
$('#btnChannels').addEventListener('click', () => { renderChannelList(); $('#chDialog').classList.add('open'); });
$('#chList').addEventListener('click', e => {
  const up = e.target.closest('[data-up]'), down = e.target.closest('[data-down]');
  if(up){ const i = order.indexOf(up.dataset.up); [order[i-1],order[i]] = [order[i],order[i-1]]; saveOrder(); }
  if(down){ const i = order.indexOf(down.dataset.down); [order[i+1],order[i]] = [order[i],order[i+1]]; saveOrder(); }
});
$('#chList').addEventListener('change', e => {
  const id = e.target.dataset.toggle; if(!id) return;
  if(e.target.checked) order.push(id);
  else if(order.length > 1) order = order.filter(x => x !== id);
  else e.target.checked = true; // mindestens ein Sender
  saveOrder();
});
// Hell/Dunkel
const savedTheme = store.get('tv.theme', null);
if(savedTheme) document.documentElement.dataset.theme = savedTheme;
$('#btnTheme').addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === 'dark'
    : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'light' : 'dark';
  store.set('tv.theme', document.documentElement.dataset.theme);
});
// Live-Markierung jede Minute aktualisieren
setInterval(() => { if(dayOffset === 0){ const top = scroller.scrollTop; renderGrid(); scroller.scrollTop = top; } }, 60000);

/* ===================== Start ===================== */
renderDays(); renderJumps(); renderGrid();
scrollToMin(PRIME);   // Standard: Ausschnitt ab 20:15
</script>
