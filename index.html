<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --blue:#0a4f94; --blue2:#1471c4; --bg:#e8edf2; --card:#fff; --text:#1d2733; --muted:#6a7787;
    --line:#e1e7ee; --max:#d7262f; --min:#1a6fc9; --rain:#2b7bd3; --sel:#e9f2fc;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  .wrap{max-width:980px;margin:0 auto}

  /* Header */
  header{background:linear-gradient(180deg,var(--blue),var(--blue2));color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 12px;position:relative;z-index:20}
  .loc-row{display:flex;align-items:center;gap:8px;min-height:44px}
  .logo{flex:none;width:40px;height:40px;border-radius:10px;padding:0;line-height:0;box-shadow:0 1px 4px rgba(0,0,0,.25)}
  .logo img{width:40px;height:40px;border-radius:10px;display:block}
  .loc-name{font-size:22px;font-weight:700;line-height:1.15;flex:0 1 auto;min-width:0}
  .loc-sp{flex:1 1 0;min-width:0}
  #favBtn{margin-left:-4px}
  .loc-name small{display:block;font-size:13px;font-weight:400;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
  .icon-btn:hover{background:rgba(255,255,255,.15)}
  .icon-btn svg{width:24px;height:24px}
  .lang{display:flex;background:rgba(255,255,255,.16);border-radius:16px;padding:2px;flex:none}
  #setBtn.on{background:#ffc107;color:#3b2a00}
  .lang button{display:flex;align-items:center;gap:4px;height:30px;padding:0 8px;border-radius:14px;font-size:12px;font-weight:700;color:#fff;opacity:.75}
  .lang button.on{background:#fff;color:var(--blue);opacity:1}
  .set-row{display:grid;grid-template-columns:130px 1fr;align-items:center;gap:8px 12px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .set-row:last-child{border-bottom:0}
  .set-row > b{font-size:14px}
  .set-row > b small{display:block;font-weight:400;color:var(--muted);font-size:12px}
  .opts{display:flex;flex-wrap:wrap;gap:6px}
  .opts button{height:36px;min-width:52px;padding:0 12px;border-radius:18px;background:#eef2f6;font-weight:600;font-size:14px;color:#3b4a5a}
  .opts button.on{background:var(--blue);color:#fff}
  #climBtn.on{background:#ffc107;color:#3b2a00}
  .emo-ic{font-size:23px;line-height:1;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
  /* Klima-Cockpit (Diagrammfarben: validierte Standardpalette, Linien 2 px, Balken max. 24 px mit 4 px Rundung) */
  .viz{--surface-1:#fff;--text-primary:#0b0b0b;--text-secondary:#52514e;--grid:#e6e8eb;--series-1:#2a78d6;--series-2:#eb6834;--series-3:#1baf7a}
  .cl-filters{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .cl-filters > span{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
  .cl-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:var(--line)}
  .cl-tile{background:#fff;padding:12px 14px}
  .cl-tile small{display:block;color:var(--muted);font-size:12px}
  .cl-tile b{display:block;font-size:24px;font-weight:600;line-height:1.2;color:var(--text-primary)}
  .cl-tile span{font-size:12px;color:var(--muted)}
  .vz-legend{display:flex;flex-wrap:wrap;gap:4px 14px;padding:10px 14px 0;font-size:13px;color:var(--text-secondary)}
  .vz-legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
  .vz-legend i.sq{height:10px;width:10px;border-radius:2px}
  .vz-wrap{position:relative;padding:4px 6px 0}
  .vz-wrap svg{display:block;touch-action:pan-y}
  .vz-wrap svg text{font:11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;fill:var(--text-secondary)}
  .vz-wrap svg text.lab{font-size:12px;font-weight:600;fill:var(--text-primary);paint-order:stroke;stroke:#fff;stroke-width:3px}
  .vz-tip{position:fixed;z-index:150;pointer-events:none;background:#fff;color:var(--text);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.16);padding:8px 10px;font-size:13px;min-width:120px;display:none}
  .vz-tip b{display:block;margin-bottom:3px}
  .vz-tip div{display:flex;align-items:center;gap:6px;white-space:nowrap}
  .vz-tip i{display:inline-block;width:10px;height:10px;border-radius:2px}
  .vz-tip em{font-style:normal;margin-left:auto;padding-left:10px;font-weight:600}
  .vz-table{padding:4px 14px 12px;font-size:13px}
  .vz-table summary{cursor:pointer;color:var(--blue);font-weight:600;padding:6px 0}
  .vz-table .tw{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px}
  .vz-table table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
  .vz-table th,.vz-table td{padding:4px 8px;text-align:right;border-bottom:1px solid var(--line)}
  .vz-table th:first-child,.vz-table td:first-child{text-align:left}
  .vz-table thead th{position:sticky;top:0;background:#f6f9fc}
  .preview{padding:12px 14px;font-size:14px;color:var(--muted);background:#f6f9fc;border-top:1px solid var(--line)}
  .preview b{color:var(--text)}
  @media (max-width:420px){.set-row{grid-template-columns:1fr}}
  .lang svg{width:20px;height:14px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.15);display:block}
  .search-row{display:flex;gap:8px;margin-top:8px;position:relative}
  .search{flex:1;display:flex;align-items:center;background:#fff;border-radius:22px;padding:0 6px 0 14px;height:44px;min-width:0}
  .search input{flex:1;border:0;outline:0;font:inherit;font-size:16px;color:var(--text);background:none;min-width:0}
  .search svg{width:20px;height:20px;color:var(--muted);flex:none}
  .tool{height:44px;border-radius:22px;background:rgba(255,255,255,.18);color:#fff;display:flex;align-items:center;gap:6px;padding:0 14px;font-weight:600;font-size:14px;flex:none}
  .tool:hover{background:rgba(255,255,255,.28)}
  .tool svg{width:20px;height:20px}
  .suggest{position:absolute;z-index:30;top:48px;left:0;right:0;max-height:min(70vh,520px);overflow-y:auto;background:#fff;color:var(--text);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);overflow:hidden;display:none}
  .suggest.open{display:block}
  .suggest button{display:block;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line)}
  .suggest button:last-child{border-bottom:0}
  .suggest button:hover,.suggest button.active{background:var(--sel)}
  .suggest small{color:var(--muted)}
  .favs{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
  .favs::-webkit-scrollbar{display:none}
  .fav{flex:none;display:flex;align-items:center;background:rgba(255,255,255,.16);border-radius:16px;height:32px;font-size:14px}
  .fav.cur{background:#fff;color:var(--blue)}
  .fav .go{padding:0 4px 0 12px;height:32px;font-weight:600}
  .fav .x{width:28px;height:32px;opacity:.7;font-size:16px}
  .favs-empty{font-size:13px;opacity:.85;align-self:center;white-space:nowrap}
  .fav.mgr{background:rgba(255,255,255,.28)}
  .fav.mgr.on{background:#ffc107;color:#3b2a00}
  .fav.mgr .go{padding:0 12px}
  .suggest .s-name{font-weight:600}
  .suggest .s-cc{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:#8a97a6;border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:1px}
  .suggest .s-cc.AT{background:#d7262f}.suggest .s-cc.DE{background:#2a2a2a}.suggest .s-cc.CH{background:#c8102e}
  .suggest small{display:block}
  .suggest .more{color:var(--blue);font-weight:600;font-size:14px}
  .suggest .info{color:var(--muted);font-size:13px;cursor:default}

  /* Favoriten-Seite */
  .fbar{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:4px 10px;padding:10px 14px 10px 10px;border-bottom:1px solid var(--line);border-left:6px solid #ccd;cursor:pointer;position:relative}
  .fbar:last-child{border-bottom:0}
  .fbar:hover{background:#f6f9fc}
  .fbar.cur{background:var(--sel)}
  .fbar .fn{min-width:0}
  .fbar .fn b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fbar .fn small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fbar .ft{font-size:30px;font-weight:300;line-height:1;text-align:right}
  .fbar .ft small{display:block;font-size:12px;font-weight:600;margin-top:3px;white-space:nowrap}
  .fbar .fm{grid-column:2/4;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted)}
  .fbar .fm span{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
  .fbar .fm .rain{color:var(--rain)} .fbar .fm .snow{color:#4b8fd6} .fbar .fm .sun{color:#b07a00}
  .fbar .fa{grid-column:1/4;display:flex;gap:6px;justify-content:flex-end;padding-top:4px}
  .fbar .fa button{height:34px;min-width:40px;border-radius:8px;background:#eef2f6;font-size:15px;padding:0 10px}
  .fbar .fa button.del{background:#fde8e8;color:#b3261e}
  .fbar .fa button:disabled{opacity:.35}
  .tools-row{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px}
  .btn2{height:40px;border-radius:20px;padding:0 14px;background:#eef2f6;font-weight:600;font-size:14px;color:var(--blue)}
  .btn2:hover{background:#e1e9f2}
  .btn2.on{background:var(--blue);color:#fff}
  .empty-favs{padding:22px 16px;text-align:center;color:var(--muted)}

  /* Tabs */
  .tabs{position:sticky;top:0;z-index:15;background:var(--bg);padding:10px 16px}
  .seg{display:grid;grid-template-columns:repeat(5,1fr);background:#d4dde7;border-radius:10px;padding:3px}
  .seg button{height:36px;border-radius:8px;font-weight:600;font-size:14px;padding:0 2px;white-space:nowrap;color:#3b4a5a}
  .seg button.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.15)}

  main{padding:0 16px 24px}
  .card{background:var(--card);border-radius:12px;box-shadow:0 1px 3px rgba(20,40,70,.12);margin-bottom:12px;overflow:hidden}
  .card h2{font-size:15px;margin:0;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .card h2 span{font-weight:400;color:var(--muted);font-size:13px}
  .pad{padding:14px}

  /* Current */
  .now{display:flex;align-items:center;gap:12px;padding:16px 14px 8px;position:relative;overflow:hidden;isolation:isolate}
  .now > *:not(.sky){position:relative;z-index:1}
  /* Himmel im Hintergrund – passend zu Tageszeit und Wetter */
  .sky{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.88}
  .sky svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .sky .drift{animation:skyDrift var(--dur,90s) linear infinite alternate}
  .sky .drift2{animation:skyDrift var(--dur2,120s) linear infinite alternate-reverse}
  .sky .rainf{animation:skyRain .7s linear infinite}
  .sky .snowf{animation:skySnow 7s linear infinite}
  .sky .twinkle{animation:skyTwinkle 3.5s ease-in-out infinite}
  .sky .flash{opacity:0;animation:skyFlash 7s linear infinite}
  .sky .fogb{animation:skyDrift 40s ease-in-out infinite alternate}
  @keyframes skyDrift{from{transform:translateX(-6%)}to{transform:translateX(8%)}}
  @keyframes skyRain{from{transform:translate(0,-40px)}to{transform:translate(var(--slant,0px),40px)}}
  @keyframes skySnow{from{transform:translate(0,-60px)}to{transform:translate(18px,60px)}}
  @keyframes skyTwinkle{0%,100%{opacity:.95}50%{opacity:.35}}
  @keyframes skyFlash{0%,88%,92%,100%{opacity:0}89%,91%{opacity:.75}90%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.sky *{animation:none!important}.sky path.flash{opacity:.9}}
  .now.on-dark .today-date{color:rgba(255,255,255,.82)}
  .now.on-dark .big,.now.on-dark .desc{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35)}
  .now.on-dark .sub{color:rgba(255,255,255,.9);text-shadow:0 1px 2px rgba(0,0,0,.4)}
  .now.on-dark .today-date{text-shadow:0 1px 2px rgba(0,0,0,.35)}
  .now.on-dark .maxmin b.mx{color:#ffa198}
  .now.on-dark .maxmin b.mn{color:#9ccbff}
  .now.on-dark .pol-ic .leaf{background:rgba(255,255,255,.9)}
  .now.on-light .big,.now.on-light .desc{text-shadow:0 1px 2px rgba(255,255,255,.6)}
  .now .today-date{font-size:14px;font-weight:600;color:var(--muted);margin-bottom:2px}
  .now .big{font-size:64px;font-weight:300;line-height:1;letter-spacing:-2px}
  .now .desc{font-size:18px;font-weight:600}
  .now .sub{color:var(--muted);font-size:14px}
  .maxmin b.mx{color:var(--max)} .maxmin b.mn{color:var(--min)}
  .details{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line)}
  .details div{background:#fff;padding:10px 14px}
  .details small{display:block;color:var(--muted);font-size:12px}
  .details b{font-size:16px;font-weight:600;display:flex;align-items:center;gap:4px}

  /* Segments (Nacht/Früh/Mittag/Abend) */
  .segs{display:grid;grid-template-columns:repeat(4,1fr);text-align:center}
  .segs > div{padding:10px 4px;border-right:1px solid var(--line)}
  .segs > div:last-child{border-right:0}
  .segs .lbl{font-size:13px;color:var(--muted);font-weight:600}
  .segs .t{font-size:20px;font-weight:600}
  .segs .r,.segs .w{font-size:12px;color:var(--muted)}
  .segs .r{color:var(--rain)}
  .day-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .day-head .d{font-weight:700;font-size:16px}
  .day-head .d span{font-weight:400;color:var(--muted);font-size:14px;margin-left:4px}
  .day-foot{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
  .day-foot b{color:var(--text);font-weight:600}

  /* Hourly + 7 day scroll grids */
  .hscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .hrow{display:flex}
  .hcell{flex:none;text-align:center;font-size:13px}
  .hrow.time .hcell{color:var(--muted);padding-top:8px;font-weight:600}
  .hrow.rain .hcell{color:var(--rain);font-size:12px;padding:2px 0}
  .hrow.wind .hcell{color:var(--muted);font-size:12px;padding:2px 0 10px}
  .hrow.wind .hcell b{color:var(--text,#1d2733);font-weight:600;white-space:nowrap}
  .gst{display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
  .hrow.wind .gst{margin-top:2px;font-size:11px}
  svg.sock{width:15px;height:14px;flex:none;vertical-align:-2px}
  .day-foot .gst{font-weight:700;color:var(--text)}
  .day-foot .gst.mid{color:#c46a00}
  .day-foot .gst.hi{color:#d0342c}
  .gst.mid{color:#c46a00;font-weight:600}
  .gst.hi{color:#d0342c;font-weight:700}
  .hcell.newday{border-left:1px dashed #b9c6d4}
  .daytile{cursor:pointer;padding:8px 2px;border-right:1px solid var(--line)}
  .daytile:last-child{border-right:0}
  .daytile.sel{background:var(--sel)}
  .daytile .wd{font-weight:700}
  .daytile .dt{font-size:12px;color:var(--muted)}
  .daytile .mx{color:var(--max);font-weight:700;font-size:17px}
  .daytile .mn{color:var(--min);font-weight:600}
  .daytile .r{color:var(--rain);font-size:12px}
  .daytile .s{color:#b07a00;font-size:12px}
  .chart text{font-size:15px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}

  /* 21 day list */
  .list .row{display:grid;grid-template-columns:76px 40px 1fr 78px;align-items:center;gap:8px;padding:6px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .list .row:last-child{border-bottom:0}
  .list .row.sel{background:var(--sel)}
  .list .row.trend{background:#fafbfc}
  .list .row .wd{font-weight:700;line-height:1.1}
  .list .row .wd small{display:block;font-weight:400;color:var(--muted);font-size:12px}
  .rng{display:flex;align-items:center;gap:6px;font-size:14px}
  .rng .mn{color:var(--min);font-weight:600;width:30px;text-align:right}
  .rng .mx{color:var(--max);font-weight:700;width:30px}
  .rng .bar{flex:1;height:6px;background:#eef2f6;border-radius:3px;position:relative}
  .rng .bar i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#3d8ce0,#f2b134,#e1462f)}
  .list .rr{font-size:12px;color:var(--rain);text-align:right;line-height:1.2}
  .badge{display:inline-block;font-size:10px;font-weight:700;background:#fff3cd;color:#8a6100;border-radius:4px;padding:1px 4px;margin-top:2px}
  .sep{padding:8px 14px;font-size:12px;color:var(--muted);background:#f3f6f9;border-bottom:1px solid var(--line)}
  .note{font-size:12px;color:var(--muted);padding:0 2px 12px}

  .detail-slot:empty{display:none}

  /* Pollen / Allergiker */
  .pol-ic{position:relative;display:inline-block;cursor:pointer;border-radius:10px;line-height:0}
  .pol-ic:hover,.pol-ic:focus-visible{background:#eef6e8;outline:none}
  .pol-ic .leaf{position:absolute;right:-3px;bottom:-2px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px #fff;display:grid;place-items:center}
  .pol-ic .leaf svg{width:15px;height:15px}
  /* Biowetter */
  .bio{border-left:4px solid var(--bio)}
  .bio-days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 14px 10px;text-align:center}
  .bio-days > div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px}
  .bio-days small{color:var(--muted);font-weight:600}
  .bio-days i{width:100%;max-width:70px;height:6px;border-radius:3px}
  .bio-it{margin:0 14px 10px;padding:8px 10px;border-left:4px solid;border-radius:6px;background:#f6f8fb}
  .bio-h{display:flex;align-items:center;gap:8px}
  .bio-ic{font-size:18px;line-height:1}
  .bio-lv{margin-left:auto;color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px}
  .bio-m{font-size:13px;margin:3px 0 2px}
  .bio-w{font-size:13px;color:var(--muted)}
  .bio-it small{display:block;font-size:12px;color:var(--muted);margin-top:3px}
  .bio-ok{margin:0 14px 10px;color:#2e9b57;font-weight:600;font-size:14px}
  .bio-src{margin:0 14px 12px;font-size:11px;color:var(--muted)}
  .bio-line{flex-basis:100%;font-weight:600;font-size:13px}
  .allergy{display:flex;gap:12px;align-items:flex-start;padding:12px 14px}
  .allergy .ico{font-size:24px;line-height:1}
  .allergy b{display:block}
  .allergy small{color:var(--muted);font-size:13px}
  .lv{display:inline-block;border-radius:4px;padding:0 5px;font-size:12px;font-weight:700;color:#fff;margin:0 2px}
  /* Info-Knopf „Wetter erklärt“ rechts unten in der Wetterkarte */
  .now > .wx-info{position:absolute;right:10px;bottom:10px;z-index:2;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
    background:rgba(255,255,255,.6);color:#1d4f86;box-shadow:0 1px 4px rgba(0,0,0,.15);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);transition:transform .15s,background .15s}
  .now > .wx-info:hover,.now > .wx-info:focus-visible{background:rgba(255,255,255,.9);transform:scale(1.08);outline:none}
  .now.on-dark > .wx-info{background:rgba(255,255,255,.22);color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
  .now.on-dark > .wx-info:hover{background:rgba(255,255,255,.35)}
  .now > .wx-info svg{width:22px;height:22px}
  .now > .wx-speak{right:54px}
  .now > .wx-speak .stop{display:none}
  .now > .wx-speak.on .stop{display:inline}
  .now > .wx-speak.on .talk{display:none}
  .now > .wx-speak.on{background:#1d4f86;color:#fff;animation:speakPulse 1.4s ease-in-out infinite}
  @keyframes speakPulse{0%,100%{box-shadow:0 0 0 0 rgba(29,79,134,.45)}50%{box-shadow:0 0 0 7px rgba(29,79,134,0)}}
  .wx-ex{padding:12px 16px 4px}
  .wx-ex h3{font-size:14px;margin:14px 0 4px;color:var(--blue)}
  .wx-ex h3:first-child{margin-top:2px}
  .wx-ex p{margin:0 0 6px;font-size:15px;line-height:1.5}
  .wx-ex .facts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0 6px}
  .wx-ex .facts div{background:#f3f6f9;border-radius:8px;padding:6px 9px;font-size:13px}
  .wx-ex .facts small{display:block;color:var(--muted);font-size:11.5px}
  .wx-ex .facts b{font-size:15px}
  .wx-ex .facts em{display:block;font-style:normal;font-size:11.5px;color:var(--muted);margin-top:1px}
  .wx-ex .wx-note{background:#fff7e6;border-left:4px solid #e8a33c;border-radius:6px;padding:8px 10px;margin:8px 0;font-size:14px;line-height:1.45}
  .wx-ex .wx-note.warn{background:#fdecea;border-left-color:#d0342c}
  .wx-ex .src{font-size:11px;color:var(--muted);margin:10px 0 2px}
  /* Wolkenerkennung per Kamera */
  .cam{margin:2px 0 6px;padding:12px;border-radius:12px;background:linear-gradient(180deg,#eaf3fd,#f6f9fc);border:1px solid #d6e5f5}
  .cam > b{display:block;font-size:15px}
  .cam > p{margin:4px 0 8px;font-size:13px;color:var(--muted);line-height:1.4}
  .cam-btns{display:flex;gap:8px;flex-wrap:wrap}
  .cam-btns label{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:20px;background:var(--blue);color:#fff;font-weight:700;font-size:14px;cursor:pointer}
  .cam-btns label.alt{background:#fff;color:var(--blue);box-shadow:inset 0 0 0 2px var(--blue)}
  .cam-btns input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
  .cl-res{margin-top:10px}
  .cl-top{display:flex;gap:10px;align-items:flex-start}
  .cl-top img{width:96px;height:96px;object-fit:cover;border-radius:10px;flex:none;box-shadow:0 1px 4px rgba(0,0,0,.2)}
  .cl-top .t{flex:1;min-width:0}
  .cl-top .t small{display:block;color:var(--muted);font-size:12px}
  .cl-top .t b{display:block;font-size:17px;margin:1px 0}
  .cl-conf{height:6px;border-radius:3px;background:#dde5ee;margin:4px 0 2px;overflow:hidden}
  .cl-conf i{display:block;height:100%;border-radius:3px}
  .cl-alt{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
  .cl-alt button{height:30px;padding:0 10px;border-radius:15px;background:#fff;border:1px solid #c9d6e4;font-size:12.5px;color:var(--text)}
  .cl-alt button.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
  .cl-card{margin-top:8px;background:#fff;border-radius:10px;padding:10px 12px;border:1px solid #dfe7f0}
  .cl-card p{margin:4px 0;font-size:14px;line-height:1.45}
  .cl-card .fc{font-weight:600}
  .cl-card .cmp{font-size:13.5px;color:#3d4a5a;background:#f3f6f9;border-radius:8px;padding:7px 9px;margin-top:6px}
  .cl-feat{font-size:11.5px;color:var(--muted);margin-top:6px}

  .sheet{position:fixed;inset:0;z-index:120;background:rgba(10,20,35,.45);display:none;align-items:flex-end;justify-content:center}
  .sheet.open{display:flex}
  .sheet .box{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;max-height:88vh;overflow-y:auto;padding:0 0 calc(14px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(0,0,0,.25)}
  @media (min-width:600px){.sheet{align-items:center}.sheet .box{border-radius:16px}}
  .sheet .hd{display:flex;align-items:center;gap:10px;padding:14px 8px 10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
  .sheet .hd div{flex:1;min-width:0}
  .sheet .hd b{display:block;font-size:17px}
  .sheet .hd small{color:var(--muted)}
  .prow{display:grid;grid-template-columns:100px 1fr 96px;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line);font-size:14px}
  .prow .bar{height:10px;border-radius:5px;background:#eef2f6;overflow:hidden}
  .prow .bar i{display:block;height:100%;border-radius:5px}
  .prow .val{text-align:right;font-size:12px;color:var(--muted);line-height:1.2}
  .prow .val b{display:block;font-size:13px}
  .ptips{padding:10px 16px 0;font-size:13px;color:var(--muted)}
  .ptips ul{margin:6px 0 8px;padding-left:18px}
  /* Outfit / Modepuppe */
  .outfit{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;align-items:start;padding:12px 14px}
  .outfit .doll{background:linear-gradient(180deg,#eaf3fc,#f7fafc);border-radius:12px;padding:6px 0;text-align:center}
  .outfit .doll svg{width:138px;height:auto;display:block;margin:0 auto}
  .outfit ul{list-style:none;margin:0;padding:0;font-size:14px}
  .outfit li{padding:4px 0;border-bottom:1px dashed var(--line);display:flex;gap:7px}
  .outfit li:last-child{border-bottom:0}
  .outfit li span{flex:none;width:22px;text-align:center}
  .outfit .why{grid-column:1/3;font-size:13px;color:var(--muted);background:#f6f9fc;border-radius:10px;padding:8px 10px}
  .outfit .why b{color:var(--text)}
  .outfit .flair{grid-column:1/3;font-size:13px;background:#fff6e0;border-radius:10px;padding:8px 10px;color:#6b4e00}
  .gsw{display:inline-flex;background:#eef2f6;border-radius:16px;padding:2px}
  .gsw button{height:28px;padding:0 10px;border-radius:14px;font-size:13px;font-weight:600;color:#3b4a5a}
  .gsw button.on{background:var(--blue);color:#fff}
  .ofbtn{color:var(--blue);font-weight:700;background:#eef4fb;border-radius:14px;padding:3px 10px;font-size:13px}
  @media (max-width:400px){.outfit{grid-template-columns:118px 1fr}.outfit .doll svg{width:110px}}
  /* Bauernregel des Tages: halbtransparentes Symbol rechts unten */
  .saying-btn{position:fixed;right:calc(14px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));z-index:90;width:68px;height:68px;border-radius:50%;
    background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.7);box-shadow:0 2px 10px rgba(20,40,70,.18);display:grid;place-items:center;opacity:.72;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:opacity .2s,transform .2s}
  .saying-btn:hover,.saying-btn:focus-visible{opacity:1;transform:scale(1.06);outline:none}
  .saying-btn svg{width:48px;height:48px}
  .saying{padding:18px 20px 6px;text-align:center}
  .saying q{display:block;font-size:20px;line-height:1.45;font-style:italic;font-weight:500;quotes:none;color:var(--text)}
  .saying .nav{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 4px 4px}
  .saying .nav button{height:40px;min-width:44px;border-radius:20px;background:#eef2f6;font-weight:700;color:var(--blue);padding:0 14px}
  .saying .nav button:disabled{opacity:.35}
  .saying .nav span{font-size:13px;color:var(--muted)}
  .saying small{display:block;color:var(--muted);font-size:12px;padding:8px 0 4px}
  .saying .ai-note{margin:8px 0 2px;font-size:10.5px;line-height:1.35;color:var(--muted);opacity:.85}
  footer{padding-bottom:96px}

  /* Niederschlagsradar */
  .radar{position:relative;isolation:isolate}
  #radarMap{height:min(64vh,560px);min-height:340px;background:#eef1f4}
  .r-time{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:500;background:rgba(255,255,255,.95);border-radius:18px;padding:5px 14px;font-weight:700;font-size:15px;box-shadow:0 1px 4px rgba(0,0,0,.25);white-space:nowrap;pointer-events:none}
  .r-time small{font-weight:600;color:var(--muted);margin-left:6px}
  .r-time.fc small{color:#b06b00}
  .r-me{position:absolute;right:10px;bottom:14px;z-index:500;width:42px;height:42px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);display:grid;place-items:center;color:var(--blue)}
  .r-me svg{width:22px;height:22px}
  svg.chart .sleigh{pointer-events:auto;cursor:pointer;transition:opacity .2s;-webkit-tap-highlight-color:transparent}
  svg.chart .sleigh:focus{outline:none}
  svg.chart .gift{pointer-events:none}
  svg.chart .sleigh .lb{display:none}
  svg.chart .sleigh.ph .la{display:none}
  svg.chart .sleigh.ph .lb{display:inline}
  /* Windpfeile auf der Radarkarte */
  .r-wind{position:absolute;right:10px;bottom:64px;z-index:500;width:42px;height:42px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);display:grid;place-items:center;color:var(--muted)}
  .r-wind.on{background:var(--blue);color:#fff}
  .r-wind svg{width:22px;height:22px}
  .w-arr{position:relative;width:0;height:0;pointer-events:none}
  .w-arr svg{position:absolute;left:-13px;top:-13px;width:26px;height:26px;filter:drop-shadow(0 0 1.5px rgba(255,255,255,.95)) drop-shadow(0 0 1px rgba(255,255,255,.95))}
  .w-arr b{position:absolute;left:-14px;top:11px;width:28px;text-align:center;font-size:10px;font-weight:700;color:#1d2733;text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 3px #fff}
  .r-wleg{display:none;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:0 14px 12px;font-size:12px;color:var(--muted)}
  .r-wleg.on{display:flex}
  .r-wleg span{display:inline-flex;align-items:center;gap:4px}
  .r-wleg i{display:inline-block;width:14px;height:4px;border-radius:2px}

  .r-ctrl{display:flex;align-items:center;gap:12px;padding:10px 14px 4px}
  .r-play{width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
  .r-play svg{width:20px;height:20px}
  .r-track{flex:1;min-width:0}
  .r-track input{width:100%;accent-color:var(--blue);margin:0}
  .r-ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:2px;position:relative;height:18px;line-height:18px}
  .r-ticks .now{color:var(--text);font-weight:700;position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
  .r-legend{display:flex;align-items:center;gap:8px;padding:14px 14px 12px;font-size:12px;color:var(--muted)}
  .r-src{grid-template-columns:1fr 1fr;margin:10px 14px}
  .r-legend details{width:100%}
  .r-legend summary{cursor:pointer;color:var(--blue);font-weight:600}
  .r-legend details img{display:block;max-width:100%;max-height:320px;margin-top:8px}
  .r-legend i{flex:1;height:8px;border-radius:4px;background:linear-gradient(90deg,#9be1ff,#00a3e0,#0050c8,#e8d100,#ff8a00,#e00000,#c800c8)}
  .fav-pin{display:flex;align-items:center;gap:4px;white-space:nowrap;transform:translate(-13px,-13px);cursor:pointer}
  .fav-pin i{flex:none;width:26px;height:26px;border-radius:50%;background:#ffc107;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);display:grid;place-items:center;font-style:normal;font-size:15px;color:#7a4b00;line-height:1}
  .fav-pin b{background:rgba(255,255,255,.95);color:#1d2733;font:600 12px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:3px 7px;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .fav-pin.cur i{background:#d7262f;color:#fff}
  .fav-pin:hover b{background:var(--blue);color:#fff}
  .me-dot{width:18px;height:18px;border-radius:50%;background:#d7262f;border:3px solid #fff;box-shadow:0 0 0 0 rgba(215,38,47,.6);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(215,38,47,.55)}70%{box-shadow:0 0 0 16px rgba(215,38,47,0)}100%{box-shadow:0 0 0 0 rgba(215,38,47,0)}}

  /* Map */
  .modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.5);display:none;flex-direction:column}
  .modal.open{display:flex}
  .modal .bar{background:var(--blue);color:#fff;display:flex;align-items:center;gap:8px;padding:calc(6px + env(safe-area-inset-top)) 8px 6px 16px;font-weight:700}
  .modal .bar span{flex:1}
  #map{flex:1;background:#dfe7ee}
  .map-foot{background:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px}
  .map-foot .info{flex:1;min-width:0;font-size:14px}
  .map-foot .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .primary{background:var(--blue);color:#fff;border-radius:22px;height:44px;padding:0 18px;font-weight:700;flex:none}
  .primary:disabled{opacity:.4}

  .loading{display:grid;place-items:center;min-height:240px;color:var(--muted)}
  .spin{width:36px;height:36px;border:4px solid #c8d4e0;border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 10px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(120px);background:#22303f;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:200;transition:transform .25s,opacity .25s;opacity:0;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  footer{font-size:12px;color:var(--muted);text-align:center;padding:4px 16px 28px}
  footer a{color:inherit}
  .hide-sm{display:inline}
  .loc-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (max-width:420px){.loc-name{font-size:19px}.loc-row{gap:4px}.loc-row .icon-btn{width:36px;height:36px}.lang button{padding:0 6px}.logo,.logo img{width:36px;height:36px}}
  @media (max-width:520px){.hide-sm{display:none}.tool{padding:0 12px}.now .big{font-size:56px}}
  /* ===== Amsel: fliegt über die Seite, sitzt auf Balken, Knöpfen und Wolken und singt ===== */
  #birdLayer{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden}
  #main .leaflet-container{isolation:isolate}
  .bird{position:absolute;left:0;top:0;width:64px;height:43px;will-change:transform;pointer-events:none;opacity:0;transition:opacity .4s;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.25))}
  .bird.ready{opacity:1}
  .bird-flip{width:100%;height:100%;transition:transform .25s ease}
  .bird.left .bird-flip{transform:scaleX(-1)}
  .bird-tilt{width:100%;height:100%;transform-origin:50% 70%}
  .bird svg{width:100%;height:100%;display:block;overflow:visible}
  .bird .hit{pointer-events:auto;cursor:pointer}
  .bird .wing,.bird .head,.bird .tail,.bird .beak-up,.bird .beak-lo,.bird .hop{transform-box:view-box}
  .bird .wing{transform-origin:72px 40px}
  .bird .head{transform-origin:84px 40px;transition:transform .25s ease}
  .bird .tail{transform-origin:36px 50px}
  .bird .beak-up{transform-origin:99px 31px;transition:transform .12s}
  .bird .beak-lo{transform-origin:99px 33px;transition:transform .12s}
  .bird .legs{transition:opacity .15s}
  .bird .hop{transform-origin:60px 74px}
  .bird.flying .legs{opacity:0}
  .bird.flying .wing{animation:birdFlap .16s ease-in-out infinite alternate}
  @keyframes birdFlap{from{transform:rotate(70deg)}to{transform:rotate(-24deg)}}
  .bird.sitting .tail{animation:birdTail 4.5s ease-in-out infinite}
  @keyframes birdTail{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-14deg)}94%{transform:rotate(4deg)}}
  .bird.peck .head{transform:rotate(14deg)}
  .bird.look .head{transform:rotate(-12deg)}
  .bird.hopping .hop{animation:birdHop .35s ease-out}
  @keyframes birdHop{40%{transform:translateY(-9px)}100%{transform:translateY(0)}}
  .bird.singing .beak-up{animation:birdBeakUp .22s ease-in-out infinite alternate}
  .bird.singing .beak-lo{animation:birdBeakLo .22s ease-in-out infinite alternate}
  .bird.singing .head{transform:rotate(-16deg)}
  .bird.singing .throat{animation:birdThroat .22s ease-in-out infinite alternate}
  @keyframes birdBeakUp{to{transform:rotate(-9deg)}}
  @keyframes birdBeakLo{to{transform:rotate(20deg)}}
  @keyframes birdThroat{to{transform:scale(1.12)}}
  .bird .throat{transform-box:fill-box;transform-origin:center}
  .bird-note{position:absolute;width:15px;height:19px;pointer-events:none;color:#ff8a1f;animation:birdNote 1.8s ease-out forwards;filter:drop-shadow(0 0 1.5px rgba(255,255,255,.9))}
  .bird-note svg{width:100%;height:100%;display:block}
  @keyframes birdNote{0%{opacity:0;transform:translate(0,0) scale(.6) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-58px) scale(1.05) rotate(var(--rot))}}
  /* Ton an/aus: halbtransparenter Knopf links unten (Gegenstück zum Bauern) */
  .bird-snd{position:fixed;left:calc(14px + env(safe-area-inset-left));bottom:calc(16px + env(safe-area-inset-bottom));z-index:90;width:52px;height:52px;border-radius:50%;
    background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.7);box-shadow:0 2px 10px rgba(20,40,70,.18);display:grid;place-items:center;opacity:.72;color:#1d2733;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:opacity .2s,transform .2s}
  .bird-snd:hover,.bird-snd:focus-visible{opacity:1;transform:scale(1.06);outline:none}
  .bird-snd svg{width:26px;height:26px}
  .bird-snd .wave,.bird-snd .mute{transition:opacity .2s}
  .bird-snd[aria-pressed="false"] .wave{opacity:0}
  .bird-snd .mute{opacity:0}
  .bird-snd[aria-pressed="false"] .mute{opacity:1}
  @media (max-width:520px){.bird{width:56px;height:37px}}
  @media (prefers-reduced-motion:reduce){.bird *,.bird-note{animation:none!important}}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- Sprache (Deutsch / Englisch) ---------- */
let LANG = store.get('lang', null) || ((navigator.language || 'de').toLowerCase().startsWith('de') ? 'de' : 'en');
if (LANG !== 'de' && LANG !== 'en') LANG = 'de';
const tr = (de, en) => LANG === 'en' ? en : de;
const dec = (v, n = 1) => { const s = (+v).toFixed(n); return LANG === 'en' ? s : s.replace('.', ','); };
const qo = s => tr('„' + s + '“', '“' + s + '”');
const STATIC = {
  map: ['Karte', 'Map'], tabToday: ['Heute', 'Today'], tab3: ['3 Tage', '3 days'], tab7: ['7 Tage', '7 days'], tab21: ['21 Tage', '21 days'],
  mapTap: ['Punkt antippen – oder ★ Favorit wählen', 'Tap a point – or pick a ★ favourite'], showWx: ['Wetter anzeigen', 'Show weather']
};
function applyStatic() {
  document.documentElement.lang = LANG;
  document.title = tr('Wetter Heute', 'Weather Today');
  const lg = document.getElementById('logoBtn'); lg.title = tr('Wetter Heute – zur Startseite', 'Weather Today – home'); lg.setAttribute('aria-label', lg.title);
  document.querySelectorAll('[data-t]').forEach(el => { const v = STATIC[el.dataset.t]; if (v) el.textContent = tr(v[0], v[1]); });
  const q = document.getElementById('q');
  q.placeholder = tr('Ort oder PLZ suchen', 'Search place or postcode'); q.setAttribute('aria-label', tr('Ort suchen', 'Search place'));
  const g = document.getElementById('gpsBtn'); g.title = tr('Mein Standort (GPS)', 'My location (GPS)'); g.setAttribute('aria-label', g.title);
  const m = document.getElementById('mapBtn'); m.title = tr('Punkt auf Karte wählen', 'Pick a point on the map'); m.setAttribute('aria-label', m.title);
  document.getElementById('mapModal').setAttribute('aria-label', tr('Karte', 'Map'));
  document.getElementById('mapClose').setAttribute('aria-label', tr('Schließen', 'Close'));
  document.getElementById('pollenSheet').setAttribute('aria-label', tr('Pollenbelastung', 'Pollen levels'));
  const bb = document.getElementById('birdBtn'); if (bb) { bb.title = tr('Amselgesang an/aus', 'Blackbird song on/off'); bb.setAttribute('aria-label', bb.title); }
  const sy = document.getElementById('sayingBtn'); sy.title = tr('Bauernregel des Tages', 'Farmer\'s saying of the day'); sy.setAttribute('aria-label', sy.title);
  document.getElementById('sayingSheet').setAttribute('aria-label', sy.title);
  document.getElementById('outfitSheet').setAttribute('aria-label', tr('Outfit-Vorschlag', 'Outfit suggestion'));
  const cb = document.getElementById('climBtn'); cb.title = tr('Klima-Cockpit: Auswertungen der letzten Jahre', 'Climate cockpit: statistics of past years'); cb.setAttribute('aria-label', cb.title);
  const sb = document.getElementById('setBtn'); sb.title = tr('Einstellungen (Einheiten)', 'Settings (units)'); sb.setAttribute('aria-label', sb.title);
  const mi = document.getElementById('mapInfo'); if (!mi.dataset.picked) mi.innerHTML = `<b>${tr('Kein Punkt gewählt', 'No point selected')}</b><small>${tr('Tippe auf die Karte', 'Tap the map')}</small>`;
  document.querySelectorAll('#langSw button').forEach(b => { b.classList.toggle('on', b.dataset.lang === LANG); b.setAttribute('aria-pressed', b.dataset.lang === LANG); });
  document.getElementById('foot').innerHTML = tr(
    `Wetterdaten: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> (u.&nbsp;a. DWD ICON, ECMWF, NOAA GFS/GEFS) · CC BY 4.0<br>
    Pollenvorhersage: Copernicus Atmosphere Monitoring Service (CAMS) über Open-Meteo · nur Europa<br>
    Niederschlagsradar: <a href="https://www.dwd.de/" target="_blank" rel="noopener">Deutscher Wetterdienst</a> (Deutschland), <a href="https://www.rainviewer.com/" target="_blank" rel="noopener">RainViewer</a> (weltweit) · Ersatzkarte: © <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a><br>
    Karte &amp; Ortsnamen: © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>-Mitwirkende · Keine Anmeldung, keine Werbung, Favoriten bleiben nur auf diesem Gerät.`,
    `Weather data: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> (incl. DWD ICON, ECMWF, NOAA GFS/GEFS) · CC BY 4.0<br>
    Pollen forecast: Copernicus Atmosphere Monitoring Service (CAMS) via Open-Meteo · Europe only<br>
    Precipitation radar: <a href="https://www.dwd.de/" target="_blank" rel="noopener">Deutscher Wetterdienst</a> (Germany), <a href="https://www.rainviewer.com/" target="_blank" rel="noopener">RainViewer</a> (worldwide) · Fallback map: © <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a><br>
    Map &amp; place names: © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors · No sign-up, no ads, favourites stay on this device only.`);
}

/* ---------- Datenquellen (kostenlos, ohne API-Schlüssel) ---------- */
const API = {
  forecast: 'https://api.open-meteo.com/v1/forecast',
  ensemble: 'https://ensemble-api.open-meteo.com/v1/ensemble',
  air:      'https://air-quality-api.open-meteo.com/v1/air-quality',
  geocode:  'https://geocoding-api.open-meteo.com/v1/search',
  reverse:  'https://nominatim.openstreetmap.org/reverse'
};
const qs = o => Object.entries(o).map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&');
async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

/* ---------- Wettercodes (WMO) ---------- */
const WMO_DE = {0:'Sonnig',1:'Überwiegend sonnig',2:'Teils bewölkt',3:'Bedeckt',45:'Nebel',48:'Reifnebel',
  51:'Leichter Nieselregen',53:'Nieselregen',55:'Starker Nieselregen',56:'Gefrierender Niesel',57:'Gefrierender Niesel',
  61:'Leichter Regen',63:'Regen',65:'Starker Regen',66:'Gefrierender Regen',67:'Gefrierender Regen',
  71:'Leichter Schneefall',73:'Schneefall',75:'Starker Schneefall',77:'Schneegriesel',
  80:'Regenschauer',81:'Kräftige Schauer',82:'Heftige Schauer',85:'Schneeschauer',86:'Starke Schneeschauer',
  95:'Gewitter',96:'Gewitter mit Hagel',99:'Schweres Gewitter'};
const WMO_EN = {0:'Sunny',1:'Mostly sunny',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Rime fog',
  51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',56:'Freezing drizzle',57:'Freezing drizzle',
  61:'Light rain',63:'Rain',65:'Heavy rain',66:'Freezing rain',67:'Freezing rain',
  71:'Light snowfall',73:'Snowfall',75:'Heavy snowfall',77:'Snow grains',
  80:'Rain showers',81:'Heavy showers',82:'Violent showers',85:'Snow showers',86:'Heavy snow showers',
  95:'Thunderstorm',96:'Thunderstorm with hail',99:'Severe thunderstorm'};
const desc = (c, day = 1) => (!day && c === 0) ? tr('Klar', 'Clear') : (!day && c === 1) ? tr('Überwiegend klar', 'Mostly clear') : ((LANG === 'en' ? WMO_EN : WMO_DE)[c] || '–');

/* ---------- Wetter-Symbole (SVG) ---------- */
function icon(code, day = 1, size = 44) {
  const c = +code;
  const sun = (cx, cy, r) => {
    let rays = '';
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4, co = Math.cos(a), si = Math.sin(a);
      rays += `<line x1="${(cx + co * (r + 3)).toFixed(1)}" y1="${(cy + si * (r + 3)).toFixed(1)}" x2="${(cx + co * (r + 8)).toFixed(1)}" y2="${(cy + si * (r + 8)).toFixed(1)}"/>`;
    }
    return `<g stroke="#f5a700" stroke-width="3" stroke-linecap="round">${rays}</g><circle cx="${cx}" cy="${cy}" r="${r}" fill="#ffc107"/>`;
  };
  const moon = (cx, cy, r) => `<path transform="rotate(-25 ${cx} ${cy})" d="M${cx} ${cy - r}A${r} ${r} 0 1 0 ${cx} ${cy + r}A${r * .55} ${r} 0 1 1 ${cx} ${cy - r}Z" fill="#f2d16b" stroke="#d9b440" stroke-width="1"/>`;
  const cloud = (tx, ty, s, kind) => {
    const fill = {light:'#eef2f6', grey:'#c3ccd6', dark:'#7d8996'}[kind], edge = {light:'#a9b6c3', grey:'#95a2b0', dark:'#5d6874'}[kind];
    const sh = '<circle cx="22" cy="36" r="9"/><circle cx="33" cy="28" r="12"/><circle cx="44" cy="36" r="9"/><rect x="22" y="30" width="22" height="15"/>';
    return `<g transform="translate(${tx} ${ty}) scale(${s})"><g fill="${edge}" stroke="${edge}" stroke-width="3">${sh}</g><g fill="${fill}">${sh}</g></g>`;
  };
  const xs = n => ({1:[32], 2:[26, 40], 3:[20, 32, 44], 4:[16, 26, 36, 46]})[n];
  const drops = n => (Array.isArray(n) ? n : xs(n)).map(x => `<line x1="${x}" y1="49" x2="${x - 4}" y2="58" stroke="#2b7bd3" stroke-width="3" stroke-linecap="round"/>`).join('');
  const small = n => xs(n).map(x => `<line x1="${x}" y1="50" x2="${x - 2}" y2="55" stroke="#2b7bd3" stroke-width="2.5" stroke-linecap="round"/>`).join('');
  const flakes = n => (Array.isArray(n) ? n : xs(n)).map(x => { const cx = x - 2, cy = 54; return `<g stroke="#5ea3e6" stroke-width="2" stroke-linecap="round"><line x1="${cx - 4}" y1="${cy}" x2="${cx + 4}" y2="${cy}"/><line x1="${cx - 2}" y1="${cy - 3.5}" x2="${cx + 2}" y2="${cy + 3.5}"/><line x1="${cx - 2}" y1="${cy + 3.5}" x2="${cx + 2}" y2="${cy - 3.5}"/></g>`; }).join('');
  const bolt = '<polygon points="34,42 25,55 31,55 27,64 41,49 34,49 38,42" fill="#ffb300" stroke="#e39400" stroke-width="1"/>';
  const top = (k = 'grey') => cloud(-11, -14, 1.3, k);
  const sky = (cx, cy, r) => day ? sun(cx, cy, r) : moon(cx, cy, r + 2);
  let s = '';
  if (c === 0) s = sky(32, 32, 13);
  else if (c === 1) s = sky(26, 26, 11) + cloud(18, 14, .75, 'light');
  else if (c === 2) s = sky(22, 22, 10) + cloud(2, 6, 1, 'light');
  else if (c === 3) s = cloud(-11, -8, 1.3, 'grey');
  else if (c === 45 || c === 48) s = top() + [49, 55, 61].map((y, i) => `<line x1="${10 + i * 4}" y1="${y}" x2="${54 - i * 4}" y2="${y}" stroke="#9aa7b4" stroke-width="3" stroke-linecap="round"/>`).join('');
  else if (c >= 51 && c <= 55) s = top('light') + small(c === 51 ? 2 : c === 53 ? 3 : 4);
  else if (c === 56 || c === 57 || c === 66 || c === 67) s = top() + drops([24, 44]) + flakes([36]);
  else if (c >= 61 && c <= 65) s = top() + drops(c === 61 ? 2 : c === 63 ? 3 : 4);
  else if (c >= 71 && c <= 77) s = top('light') + flakes(c === 71 ? 2 : c === 73 || c === 77 ? 3 : 4);
  else if (c >= 80 && c <= 82) s = sky(18, 16, 8) + top('light') + drops(c === 80 ? 2 : c === 81 ? 3 : 4);
  else if (c === 85 || c === 86) s = sky(18, 16, 8) + top('light') + flakes(c === 85 ? 2 : 3);
  else if (c >= 95) s = top('dark') + bolt;
  else s = cloud(-11, -8, 1.3, 'grey');
  return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" role="img" aria-label="${esc(desc(c, day))}">${s}</svg>`;
}
const arrow = deg => `<svg width="14" height="14" viewBox="0 0 24 24" style="transform:rotate(${(deg + 180) % 360}deg)"><path d="M12 3l6 16-6-4-6 4z" fill="currentColor"/></svg>`;
const DIRS_DE = ['N', 'NO', 'O', 'SO', 'S', 'SW', 'W', 'NW'], DIRS_EN = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
const dirTxt = deg => (LANG === 'en' ? DIRS_EN : DIRS_DE)[Math.round(((deg % 360) + 360) % 360 / 45) % 8];
const r0 = v => (v == null || isNaN(v)) ? '–' : Math.round(v);
/* ---------- Einheiten (Einstellungen) ----------
   Die Daten werden immer metrisch geladen und erst bei der Anzeige umgerechnet. */
const UNITS_DEFAULT = { temp: 'c', wind: 'kmh', precip: 'mm', pressure: 'hpa', time: '24' };
let U = Object.assign({}, UNITS_DEFAULT, store.get('units', {}));
const cT = v => v == null || isNaN(v) ? null : U.temp === 'f' ? v * 9 / 5 + 32 : v;
const tp = v => r0(cT(v));
const BFT = [1, 6, 12, 20, 29, 39, 50, 62, 75, 89, 103, 118];   // Beaufort-Grenzen in km/h
const bft = v => { let b = 0; while (b < 12 && v >= BFT[b]) b++; return b; };
const wUnit = () => ({ kmh: 'km/h', ms: 'm/s', mph: 'mph', kn: 'kn', bft: 'Bft' })[U.wind];
const wv = v => {
  if (v == null || isNaN(v)) return '–';
  if (U.wind === 'bft') return bft(v);
  if (U.wind === 'ms') { const x = v / 3.6; return x < 10 ? dec(x) : Math.round(x); }
  return Math.round(U.wind === 'mph' ? v / 1.609344 : U.wind === 'kn' ? v / 1.852 : v);
};
const ws = v => wv(v) + ' ' + wUnit();
const mm = v => {
  if (v == null) return '–';
  if (U.precip === 'in') { const x = v / 25.4; return (x < 0.005 ? '0' : dec(x, 2)) + ' in'; }
  return (v < 0.05 ? '0' : v < 10 ? dec(v) : Math.round(v)) + ' mm';
};
const snowTxt = cm => U.precip === 'in' ? dec(cm / 2.54) + ' in' : dec(cm) + ' cm';
const pres = v => v == null ? '–' : U.pressure === 'inhg' ? dec(v * 0.0295300, 2) + ' inHg' : U.pressure === 'mmhg' ? Math.round(v * 0.750062) + ' mmHg' : Math.round(v) + ' hPa';
/* Uhrzeit "HH:MM" -> 24 h bzw. 12 h (AM/PM) */
const fmtTime = hm => {
  if (!hm || hm.length < 5) return '–';
  if (U.time !== '12') return hm;
  const h = +hm.slice(0, 2); return (h % 12 || 12) + ':' + hm.slice(3, 5) + (h < 12 ? ' AM' : ' PM');
};
const withUhr = hm => U.time === '12' ? fmtTime(hm) : tr(hm + ' Uhr', hm);
const hourLbl = t => { const h = +t.slice(11, 13); return U.time === '12' ? (h % 12 || 12) + (h < 12 ? ' AM' : ' PM') : tr(t.slice(11, 13) + ' Uhr', t.slice(11, 16)); };

/* ---------- Datum ---------- */
const WD_DE = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'], WD_EN = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const WDL_DE = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'], WDL_EN = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MON_EN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const pd = s => { const [y, m, d] = s.slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); };
const dshort = s => { const d = pd(s); return LANG === 'en' ? d.getDate() + ' ' + MON_EN[d.getMonth()] : String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.'; };
const dayName = (s, i, long) => i === 0 ? tr('Heute', 'Today') : i === 1 ? tr('Morgen', 'Tomorrow') : (long ? (LANG === 'en' ? WDL_EN : WDL_DE) : (LANG === 'en' ? WD_EN : WD_DE))[pd(s).getDay()];
const hhmm = s => s ? fmtTime(s.slice(11, 16)) : '–';

/* ---------- Zustand ---------- */
let state = { loc: null, data: null, trend: null, trendFor: null, view: store.get('view', 'today'), sel: null };
let favs = store.get('favs', []);
const toastEl = $('#toast'); let toastT;
function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), 3500); }
const key = l => l.lat.toFixed(3) + ',' + l.lon.toFixed(3);

/* ---------- Laden ---------- */
async function loadLocation(loc) {
  if (state.view === 'favs' || state.view === 'settings') state.view = state.prevView || 'today';
  if (speaking && window.speechSynthesis) { speechSynthesis.cancel(); speaking = false; }
  state.loc = loc; state.data = null; state.trend = null; state.trendFor = null; state.sel = null; state.radarSrc = null; state.pollen = null;
  store.set('lastLoc', loc);
  destroyRadar();
  renderHeader();
  $('#main').innerHTML = `<div class="loading"><div><div class="spin"></div>${tr('Lade Wetter …', 'Loading weather …')}</div></div>`;
  try {
    state.data = await getJSON(API.forecast + '?' + qs({
      latitude: loc.lat, longitude: loc.lon, timezone: 'auto', forecast_days: 16,
      current: 'temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m',
      hourly: 'temperature_2m,apparent_temperature,precipitation_probability,precipitation,snowfall,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m,is_day,uv_index,pressure_msl,dew_point_2m,relative_humidity_2m,cloud_cover_low,cloud_cover_mid,cloud_cover_high,cape',
      daily: 'weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,precipitation_sum,snowfall_sum,precipitation_probability_max,sunrise,sunset,sunshine_duration,wind_speed_10m_max,wind_gusts_10m_max,wind_direction_10m_dominant,uv_index_max'
    }));
    state.loadedAt = Date.now();
    render();
    loadPollen();
  } catch (e) {
    $('#main').innerHTML = `<div class="card pad">${tr('Die Wetterdaten konnten nicht geladen werden. Bitte Internetverbindung prüfen.', 'The weather data could not be loaded. Please check your internet connection.')}<br><br><button class="primary" id="retry">${tr('Erneut versuchen', 'Try again')}</button></div>`;
    $('#retry').onclick = () => loadLocation(loc);
  }
}

/* Trend Tag 17–21: Ensemble-Mittel aus NOAA GEFS (31 Läufe, bis 35 Tage) */
async function loadTrend() {
  const loc = state.loc, k = key(loc);
  if (state.trendFor === k) return;
  state.trendFor = k;
  try {
    const j = await getJSON(API.ensemble + '?' + qs({
      latitude: loc.lat, longitude: loc.lon, timezone: 'auto', forecast_days: 22, models: 'gfs05',
      hourly: 'temperature_2m,precipitation,cloud_cover'
    }));
    if (key(state.loc) !== k) return;
    const h = j.hourly, times = h.time;
    const members = v => Object.keys(h).filter(n => n === v || n.startsWith(v + '_member')).map(n => h[n]);
    const T = members('temperature_2m'), P = members('precipitation'), C = members('cloud_cover');
    const days = {};
    times.forEach((t, i) => {
      const d = t.slice(0, 10);
      const o = days[d] || (days[d] = { t: [], c: [], p: P.map(() => 0) });
      const tv = T.map(a => a[i]).filter(v => v != null);
      if (tv.length) o.t.push(tv.reduce((a, b) => a + b, 0) / tv.length);
      const cv = C.map(a => a[i]).filter(v => v != null);
      if (cv.length) o.c.push(cv.reduce((a, b) => a + b, 0) / cv.length);
      P.forEach((a, m) => { o.p[m] += a[i] || 0; });
    });
    state.trend = Object.entries(days).map(([d, o]) => {
      const p = o.p.reduce((a, b) => a + b, 0) / (o.p.length || 1);
      const prob = Math.round(100 * o.p.filter(v => v >= 0.5).length / (o.p.length || 1));
      const tmax = Math.max(...o.t), tmin = Math.min(...o.t);
      const cc = o.c.length ? o.c.reduce((a, b) => a + b, 0) / o.c.length : 50;
      let code = cc < 25 ? 1 : cc < 60 ? 2 : 3;
      if (prob >= 40 && p >= 0.5) code = tmax < 1 ? (p > 4 ? 73 : 71) : (p > 8 ? 65 : p > 2 ? 63 : 61);
      else if (prob >= 25 && p >= 0.3) code = tmax < 1 ? 85 : 80;
      return { date: d, tmax, tmin, rain: p, prob, code };
    });
  } catch (e) { state.trend = []; }
  if (state.view === '21') render();
}

/* ---------- Header / Favoriten ---------- */
function renderHeader() {
  const l = state.loc;
  $('#locName').innerHTML = esc(l ? l.name : tr('Wetter', 'Weather')) + `<small>${esc(l ? (l.sub || (l.lat.toFixed(3) + '°, ' + l.lon.toFixed(3) + '°')) : tr('Standort wird ermittelt …', 'Detecting location …'))}</small>`;
  const isFav = l && favs.some(f => key(f) === key(l));
  $('#favBtn').querySelector('path').setAttribute('fill', isFav ? '#ffc107' : 'none');
  $('#favBtn').querySelector('svg').setAttribute('stroke', isFav ? '#ffc107' : 'currentColor');
  $('#favBtn').title = isFav ? tr('Aus Favoriten entfernen', 'Remove from favourites') : tr('Als Favorit speichern', 'Save as favourite');
  $('#favBtn').setAttribute('aria-label', $('#favBtn').title);
  $('#favs').innerHTML = `<div class="fav mgr ${state.view === 'favs' ? 'on' : ''}"><button class="go" data-mgr="1">☰ ${tr('Favoriten', 'Favourites')}${favs.length ? ' (' + favs.length + ')' : ''}</button></div>`
    + (favs.length
      ? favs.map((f, i) => `<div class="fav ${l && key(f) === key(l) ? 'cur' : ''}"><button class="go" data-i="${i}" style="padding-right:12px">${esc(f.name)}</button></div>`).join('')
      : `<div class="favs-empty">☆ ${tr('Stern antippen = Ort merken', 'Tap the star to save a place')}</div>`);
}
function saveFavs() { store.set('favs', favs); store.set('favsChanged', Date.now()); renderHeader(); askPersist(); }
/* Browser bitten, die gespeicherten Daten dauerhaft zu behalten (nicht automatisch aufräumen) */
function askPersist() { try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {} }
$('#favBtn').onclick = () => {
  const l = state.loc; if (!l) return;
  const i = favs.findIndex(f => key(f) === key(l));

/* ---------- Ortssuche ----------
   1. Open-Meteo-Ortsdatenbank (GeoNames) für schnelle Vorschläge beim Tippen

      – laut Nutzungsregeln nicht als Tipp-Vorschlag, sondern nur für vollständige PLZ bzw. auf Knopfdruck, max. 1 Anfrage/s

function parseQuery(v) {

let nomLast = 0;
async function nominatim(params) {

}
const fromOM = r => ({ name: r.name, plz: (r.postcodes || [])[0] || '', plzs: r.postcodes || [], region: cleanRegion(r.admin2 || r.admin3 || ''), state: r.admin1 || '',

function rankResults(list, pq) {

/* ---------- Reverse-Geocoding (Ortsname zu Koordinaten) ---------- */
async function placeName(lat, lon) {
  try {
    const j = await getJSON(API.reverse + '?' + qs({ format: 'jsonv2', lat, lon, zoom: 12, 'accept-language': LANG }));
    const a = j.address || {};
    const name = a.city || a.town || a.village || a.municipality || a.hamlet || a.suburb || a.county || j.name;

/* ---------- GPS ---------- */
function useGPS(silent) {
  return new Promise(res => {
    if (!navigator.geolocation) { if (!silent) toast(tr('GPS wird von diesem Gerät nicht unterstützt', 'GPS is not supported on this device')); return res(false); }
    if (!silent) toast(tr('Standort wird ermittelt …', 'Detecting location …'));
    navigator.geolocation.getCurrentPosition(async p => {
      const lat = p.coords.latitude, lon = p.coords.longitude;
      const n = await placeName(lat, lon);
      loadLocation({ name: n.name, sub: '📍 ' + (n.sub || tr('Mein Standort', 'My location')), lat, lon, cc: n.cc }); res(true);
    }, err => {
      if (!silent) toast(err.code === 1 ? tr('Standortzugriff wurde nicht erlaubt', 'Location access was denied') : tr('Standort konnte nicht ermittelt werden', 'Location could not be determined'));

}

  const cnt = {}; codes.forEach(c => cnt[c] = (cnt[c] || 0) + 1);

const SEGS = [['night', 0, 6], ['morning', 6, 12], ['midday', 12, 18], ['evening', 18, 24]];

/* ---------- Biowetter: Hinweise für Wetterfühlige (aus der stündlichen Vorhersage abgeleitet) ---------- */
const BIO_COL = ['#2e9b57', '#d9a300', '#e8742c', '#d0342c'];

function moonPhase(date) {
  const syn = 29.530588853, ref = Date.UTC(2000, 0, 6, 18, 14);
  let p = ((date.getTime() - ref) / 86400000 / syn) % 1; if (p < 0) p += 1;
  return p;   // 0 = Neumond, 0,25 = erstes Viertel, 0,5 = Vollmond, 0,75 = letztes Viertel
}
function moonName(p) {
  const n = [[0.03, tr('Neumond', 'New moon')], [0.22, tr('zunehmende Sichel', 'Waxing crescent')], [0.28, tr('erstes Viertel', 'First quarter')],
    [0.47, tr('zunehmender Mond', 'Waxing gibbous')], [0.53, tr('Vollmond', 'Full moon')], [0.72, tr('abnehmender Mond', 'Waning gibbous')],
    [0.78, tr('letztes Viertel', 'Last quarter')], [0.97, tr('abnehmende Sichel', 'Waning crescent')], [1.01, tr('Neumond', 'New moon')]];
  return n.find(([lim]) => p < lim)[1];
}
function skyScene(C, D) {
  const mins = t => t ? +t.slice(11, 13) * 60 + +t.slice(14, 16) : null;
  const now = mins(C.time), rise = mins(D.sunrise[0]), set = mins(D.sunset[0]);
  let tod = C.is_day ? 'day' : 'night';
  if (now != null && rise != null && set != null) {
    if (Math.abs(now - rise) <= 45) tod = 'dawn';
    else if (Math.abs(now - set) <= 45) tod = 'dusk';
    else tod = now > rise && now < set ? 'day' : 'night';
  }
  const c = C.weather_code;
  const wx = c >= 95 ? 'storm' : (c >= 71 && c <= 77) || c === 85 || c === 86 ? 'snow' : c >= 51 ? 'rain' : c === 45 || c === 48 ? 'fog' : c === 3 ? 'overcast' : c === 2 ? 'partly' : c === 1 ? 'fair' : 'clear';
  const windy = (C.wind_gusts_10m || 0) >= 60;

    day: { clear: ['#3d8fe0', '#9ccff5'], fair: ['#4a95dd', '#a8d3f2'], partly: ['#5b98d0', '#b4d2ea'], overcast: ['#8e9aa7', '#c7ced6'], fog: ['#b7bec6', '#e1e5e9'], rain: ['#6c7a89', '#a7b1bc'], snow: ['#9fb0c2', '#e2e8ef'], storm: ['#3b4352', '#68717f'] },
    dawn: { clear: ['#9aa8d8', '#f8c9a0'], fair: ['#9ba6d2', '#f4ccaa'], partly: ['#a2a8c8', '#eed0b8'], overcast: ['#7d8595', '#c9b9b0'], fog: ['#a9aeb7', '#dcd3cc'], rain: ['#5f6878', '#9c9aa0'], snow: ['#8c98ab', '#d9d6db'], storm: ['#363c4a', '#615f66'] },
    dusk: { clear: ['#24306a', '#c96a45'], fair: ['#2b3669', '#c0714f'], partly: ['#363e68', '#b27a62'], overcast: ['#5c6474', '#a79a95'], fog: ['#959aa4', '#cbc2bb'], rain: ['#4a5262', '#827f86'], snow: ['#7a8599', '#c8c3c9'], storm: ['#2c313d', '#55525a'] },
    night: { clear: ['#07112a', '#1c3264'], fair: ['#0b1531', '#223563'], partly: ['#141d33', '#2b3a5c'], overcast: ['#1d232e', '#363e4c'], fog: ['#2a3039', '#4a515c'], rain: ['#151b25', '#2e3542'], snow: ['#232b38', '#47505f'], storm: ['#0f131a', '#272c35'] }

function skyHTML(C, D) {

    <radialGradient id="sunG"><stop offset="0" stop-color="#fff6c8" stop-opacity=".95"/><stop offset=".35" stop-color="#ffe08a" stop-opacity=".55"/><stop offset="1" stop-color="#ffe08a" stop-opacity="0"/></radialGradient>
    <radialGradient id="moonG"><stop offset="0" stop-color="#fffbe6" stop-opacity=".45"/><stop offset="1" stop-color="#fffbe6" stop-opacity="0"/></radialGradient></defs>

  const clear = S.wx === 'clear' || S.wx === 'fair' || S.wx === 'partly';
  let title = '';

  }

  }

  if (nC) {

    const dark = S.tod === 'night' ? '#2c3447' : S.wx === 'storm' ? '#2d333e' : '#8794a3';

/* Jahreszeit (meteorologisch) für ein Datum; auf der Südhalbkugel umgekehrt */
function seasonOf(d) {
  const mo = d.getMonth(), south = state.loc && state.loc.lat < 0;
  let se = mo >= 2 && mo <= 4 ? 'sp' : mo >= 5 && mo <= 7 ? 'su' : mo >= 8 && mo <= 10 ? 'au' : 'wi';
  if (south) se = { sp: 'au', su: 'wi', au: 'sp', wi: 'su' }[se];
  return se;
}
const gcd = (a, b) => b ? gcd(b, a % b) : a;
function sayingIdx(d) {
  const mo = d.getMonth() + 1, south = state.loc && state.loc.lat < 0;
  const pool = SAYINGS.map((x, i) => [x, i])
    .filter(([x]) => (x[2] === 'all' || x[2].split(' ').includes(seasonOf(d))) && (!x[3] || (!south && x[3].includes(mo))))   // Monats-/Feiertagssprüche nur im passenden Monat
    .map(([, i]) => i);
  const n = Math.floor(d.getTime() / 86400000), step = [7, 11, 13, 17, 19, 23].find(k => gcd(k, pool.length) === 1);
  return pool[((n * step) % pool.length + pool.length) % pool.length];   // gleichmäßig verteilt, kein Wiederholen an Nachbartagen
}
function sayingFor(offset) {
  const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() + offset);
  let i = sayingIdx(d);
  const prev = new Date(d); prev.setDate(prev.getDate() - 1);
  if (i === sayingIdx(prev)) i = (i + 1) % SAYINGS.length;   // am Jahreszeitenwechsel nicht zweimal derselbe Spruch
  return { date: d, season: seasonOf(d), text: SAYINGS[i][LANG === 'en' ? 1 : 0] };
}

  const iso = date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');

  destroyRadar();
  const v = state.view;
  if (v === 'favs') { $('#main').innerHTML = viewFavs(); renderHeader(); return; }
  if (v === 'settings') { $('#main').innerHTML = viewSettings(); return; }
  if (v === 'climate') { $('#main').innerHTML = viewClimate(); return; }
  if (!state.data) return;
  try {
    $('#main').innerHTML = v === '3' ? view3() : v === '7' ? view7() : v === '21' ? view21() : v === 'radar' ? viewRadar() : viewToday();
    if (v === 'radar') initRadar();
  } catch (e) {
    console.error(e);
    $('#main').innerHTML = `<div class="card pad">${tr('Darstellung fehlgeschlagen. Bitte neu laden.', 'Display failed. Please reload.')}</div>`;
  }
}
$('#main').onclick = e => {
  if (state.view === 'favs') { favClick(e); return; }
  if (state.view === 'settings') { settingsClick(e); return; }
  if (state.view === 'climate') { climateClick(e); return; }
  const gb = e.target.closest('[data-g]'); if (gb) { setGender(gb.dataset.g); return; }
  const ob = e.target.closest('[data-outfit]'); if (ob) { e.stopPropagation(); showOutfit(+ob.dataset.outfit); return; }
  const pol = e.target.closest('[data-pollen]');
  if (pol) { e.stopPropagation(); showPollen(pol.dataset.pollen, pol.dataset.h0, pol.dataset.h1); return; }
  const t = e.target.closest('[data-day]'); if (!t) return;
  const i = +t.dataset.day;
  state.sel = (state.view === '21' && state.sel === i) ? null : i;
  render();
};

/* Sprache umschalten (Fahnen im Kopfbereich) */
$('#langSw').onclick = e => { const b = e.target.closest('button[data-lang]'); if (b) setLang(b.dataset.lang); };

/* Aktualisieren, wenn die App nach >15 Min wieder geöffnet wird */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.loc && state.loadedAt && Date.now() - state.loadedAt > 15 * 60 * 1000) loadLocation(state.loc);
});


/* ---------- Amsel: fliegt über die Seite, setzt sich auf Balken, Knöpfe und Wolken und singt ---------- */
/* Standardmäßig ausgeblendet – einblenden unter Einstellungen (wird gespeichert) */
let birdShown = store.get('birdShow', false), birdCtl = null;
(function () {
  const layer = document.getElementById('birdLayer'), bird = layer && layer.querySelector('.bird'), btn = $('#birdBtn');
  if (!bird || !btn) return;
  const tiltEl = bird.querySelector('.bird-tilt');
  const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Strophen in der Tondatei (Sekunden), passend zu den Pausen im Gesang
  const PHRASES = [[0.6, 3.5], [5.9, 13.3], [15.8, 20.7], [24.7, 28.1]];
  const VOL = 0.6;
  let audio = null, unlocked = false, soundOn = store.get('amsel', 'on') !== 'off', fadeTimer = null, stopTimer = null;
  // iPhone/iPad erlauben keine Lautstärke per Skript – dann ohne Ein-/Ausblenden
  const canVol = (() => { try { const t = new Audio(); t.volume = 0.5; return Math.abs(t.volume - 0.5) < 0.01; } catch (e) { return false; } })();
  const showState = () => btn.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
  showState();

  function ensureAudio() {
    if (!audio) {
      // Gesang steckt in der Seite selbst – die HTML-Datei funktioniert damit auch einzeln heruntergeladen
      const bin = atob(document.getElementById('amselMp3').textContent.trim()), u = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      audio = new Audio(URL.createObjectURL(new Blob([u], { type: 'audio/mpeg' })));
      audio.preload = 'auto';
    }
    return audio;
  }
  /* Browser erlauben Ton oft erst nach der ersten Berührung. Der Ton ist trotzdem von Anfang an eingeschaltet:
     Die Amsel versucht sofort zu singen; blockiert der Browser, singt sie bei der ersten Berührung der Seite. */
  const EVS = ['click', 'touchend', 'keydown', 'pointerup'];
  function unlock() {
    if (unlocked || !birdShown) return;
    unlocked = true;
    EVS.forEach(ev => window.removeEventListener(ev, unlock, true));
    const a = ensureAudio();
    if (a.__singing) return;
    a.muted = true;
    const pr = a.play();
    const done = () => { if (!a.__singing) a.pause(); a.muted = false; if (soundOn && st.mode === 'sit' && !bird.classList.contains('singing')) sing(); };
    if (pr && pr.then) pr.then(done, () => { a.muted = false; }); else done();
  }
  EVS.forEach(ev => window.addEventListener(ev, unlock, true));

  function stopSound(fast) {
    clearTimeout(stopTimer); clearInterval(fadeTimer);
    if (!audio) return;
    audio.__singing = false;
    if (audio.paused) return;
    if (fast || !canVol) { audio.pause(); return; }
    fadeTimer = setInterval(() => { audio.volume = Math.max(0, audio.volume - 0.08); if (audio.volume <= 0.02) { clearInterval(fadeTimer); audio.pause(); } }, 40);
  }
  function playPhrase(p) {
    if (!soundOn) return;
    const a = ensureAudio();
    clearTimeout(stopTimer); clearInterval(fadeTimer);
    const go = () => {
      try { a.currentTime = p[0]; } catch (e) {}
      a.muted = false; a.__singing = true;
      if (canVol) a.volume = 0.05;
      const pr = a.play();
      if (pr && pr.then) pr.then(() => { if (!unlocked) unlock(); }, () => { a.__singing = false; });   // ohne Berührung blockiert → später
      if (canVol) fadeTimer = setInterval(() => { a.volume = Math.min(VOL, a.volume + 0.07); if (a.volume >= VOL) clearInterval(fadeTimer); }, 40);
      stopTimer = setTimeout(() => stopSound(false), (p[1] - p[0]) * 1000);
    };
    if (a.readyState >= 1) go(); else a.addEventListener('loadedmetadata', go, { once: true });
  }

  let firstPress = !unlocked;
  btn.addEventListener('click', e => {
    e.stopPropagation();
    const wasLocked = !unlocked;
    unlock();
    // Erster Klick bei eingeschaltetem, aber vom Browser noch blockiertem Ton: nicht ausschalten, sondern singen
    if (!(firstPress && wasLocked && soundOn)) soundOn = !soundOn;
    firstPress = false;
    showState(); store.set('amsel', soundOn ? 'on' : 'off');
    if (!soundOn) { stopSound(true); return; }
    if (st.mode === 'sit') { bird.classList.remove('singing'); sing(); }
  });

  /* ---------- Sitzplätze ---------- */
  const SEL = '.now .sky .drift > g, .now .sky .drift2 > g, .card, .fav, #tabs button, .tool, .icon-btn, .lang, .saying-btn, .bird-snd, #main .row[data-day], .fbar';
  const isCloud = el => el instanceof SVGElement;
  function spot(el) {               // Oberkante des Ziels im Fenster, oder null wenn nicht sichtbar
    if (!el || !el.isConnected) return null;
    const r = el.getBoundingClientRect();
    if (r.width < 26 || r.height < 8) return null;
    if (r.top < bird.offsetHeight * 0.95 + 4 || r.top > innerHeight - 50 || r.left > innerWidth - 20 || r.right < 20) return null;
    if (isCloud(el)) {              // Wolke nur, wenn sie innerhalb der Wetterkarte zu sehen ist
      const n = el.closest('.now'); if (!n) return null;
      const c = n.getBoundingClientRect(), cx = r.left + r.width / 2;
      if (r.top < c.top + 4 || cx < c.left + 30 || cx > c.right - 30 || r.top > c.bottom - 30) return null;
    }
    return r;
  }
  function candidates() {
    const out = [];
    document.querySelectorAll(SEL).forEach(el => {
      if (el.closest('.modal, .sheet, .overlay, #birdLayer')) return;
      const r = spot(el); if (!r) return;
      out.push({ el, w: isCloud(el) ? 5 : el.matches('.card') ? 1 : 1.6 });
    });
    return out;
  }
  function pick() {
    const c = candidates().filter(x => x.el !== st.el);
    if (!c.length) return null;
    let s = c.reduce((a, x) => a + x.w, 0) * Math.random();
    for (const x of c) { s -= x.w; if (s <= 0) return x.el; }
    return c[c.length - 1].el;
  }

  /* ---------- Bewegung ---------- */
  const st = { mode: 'away', el: null, frac: 0.5, x: -120, y: 80, left: false };
  let flight = null, timers = [], running = false;
  const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); return t; };
  const clearLater = () => { timers.forEach(t => { clearTimeout(t); clearInterval(t); }); timers = []; };
  const rnd = (a, b) => a + Math.random() * (b - a);
  const size = () => ({ w: bird.offsetWidth, h: bird.offsetHeight });
  function perch(el, frac) {
    const r = spot(el); if (!r) return null;
    const s = size();
    const f = isCloud(el) ? 0.5 + (frac - 0.5) * 0.4 : frac;   // auf der Wolke mittig auf der Kuppe
    const top = isCloud(el) ? Math.max(r.top, el.closest('.now').getBoundingClientRect().top) : r.top;
    return { x: r.left + f * r.width - s.w / 2, y: top - s.h * (isCloud(el) ? 0.82 : 0.925) };
  }
  function place(x, y, tilt) {
    st.x = x; st.y = y;
    bird.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
    tiltEl.style.transform = `rotate(${(tilt || 0).toFixed(1)}deg)`;
  }
  function face(left) { st.left = left; bird.classList.toggle('left', left); }

  function flyTo(el, frac) {
    clearLater(); stopSound(false);
    bird.classList.remove('sitting', 'singing', 'peck', 'look');
    bird.classList.add('flying');
    st.mode = 'fly';
    const away = !el;
    const end = away ? { x: Math.random() < 0.5 ? -140 : innerWidth + 140, y: rnd(40, innerHeight * 0.4) } : perch(el, frac);
    if (!end) { later(next, 800); st.mode = 'away'; return; }
    const dist = Math.hypot(end.x - st.x, end.y - st.y);
    flight = { el, frac, away, x0: st.x, y0: st.y, end, t0: performance.now(), dur: Math.max(900, Math.min(3200, dist / 0.42)), lift: rnd(70, 150) };
    face(end.x < st.x);
    st.el = el; st.frac = frac;
  }
  function land() {
    bird.classList.remove('flying'); bird.classList.add('sitting');
    st.mode = 'sit';
    tiltEl.style.transform = 'rotate(0deg)';
    later(sing, rnd(500, 1400));
    later(fidget, rnd(2600, 4000));
    later(next, rnd(9000, 15000));
  }
  function sing() {
    if (st.mode !== 'sit' || bird.classList.contains('singing')) return;
    const p = PHRASES[Math.floor(Math.random() * PHRASES.length)];
    const dur = Math.min((p[1] - p[0]) * 1000, 7400);
    bird.classList.add('singing');
    playPhrase(p);
    let n = 0; const iv = setInterval(() => { note(); if (++n > dur / 450) clearInterval(iv); }, 450);
    timers.push(iv);
    later(() => { bird.classList.remove('singing'); clearInterval(iv); }, dur);
  }
  function fidget() {
    if (st.mode !== 'sit' || bird.classList.contains('singing')) { later(fidget, 1500); return; }
    const r = Math.random();
    if (r < 0.3) face(!st.left);
    else if (r < 0.55) { bird.classList.add('peck'); later(() => bird.classList.remove('peck'), 380); }
    else if (r < 0.8) { bird.classList.add('look'); later(() => bird.classList.remove('look'), 900); }
    else { bird.classList.remove('hopping'); void bird.offsetWidth; bird.classList.add('hopping'); st.frac = Math.min(0.85, Math.max(0.15, st.frac + (st.left ? -0.08 : 0.08))); }
    later(fidget, rnd(1600, 3200));
  }
  function next() {
    if (Math.random() < 0.12) { flyTo(null); return; }      // kurz wegfliegen …
    const el = pick();
    flyTo(el, rnd(0.2, 0.8));
  }
  function note() {
    const s = size(), el = document.createElement('span');
    el.className = 'bird-note';
    el.style.left = ((st.left ? st.x + s.w * 0.08 : st.x + s.w * 0.86) - 8) + 'px';
    el.style.top = (st.y - 6) + 'px';
    el.style.setProperty('--dx', ((st.left ? -1 : 1) * rnd(8, 26)).toFixed(0) + 'px');
    el.style.setProperty('--rot', rnd(-25, 25).toFixed(0) + 'deg');
    el.innerHTML = Math.random() < 0.5
      ? '<svg viewBox="0 0 16 20"><path d="M11 1v12.5a3.2 3.2 0 1 1-2-3V4.5L15 3V1z" fill="currentColor"/></svg>'
      : '<svg viewBox="0 0 16 20"><path d="M5 3l10-2v12a3 3 0 1 1-2-2.8V5L7 6.2V15a3 3 0 1 1-2-2.8z" fill="currentColor"/></svg>';
    layer.appendChild(el);
    setTimeout(() => el.remove(), 1900);
  }
  function frame(now) {
    if (!running) return;
    if (st.mode === 'fly' && flight) {
      const f = flight;
      if (!f.away) {                    // Ziel folgt dem Element (Scrollen, ziehende Wolke); verschwindet es → neues Ziel
        const p = perch(f.el, f.frac);
        if (p) f.end = p;
        else { const el = pick(); if (el && perch(el, 0.5)) { f.el = el; st.el = el; f.end = perch(el, f.frac); } }
      }
      const t = Math.min(1, (now - f.t0) / f.dur);
      const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      const cx = (f.x0 + f.end.x) / 2, cy = Math.min(f.y0, f.end.y) - f.lift, u = 1 - e;
      const x = u * u * f.x0 + 2 * u * e * cx + e * e * f.end.x;
      const y = u * u * f.y0 + 2 * u * e * cy + e * e * f.end.y;
      const dy = 2 * u * (cy - f.y0) + 2 * e * (f.end.y - cy);
      place(x, y, Math.max(-22, Math.min(22, dy / 12)) * (f.end.x < f.x0 ? -1 : 1));
      if (t >= 1) {
        flight = null;
        if (f.away) { st.mode = 'away'; bird.classList.remove('flying'); later(next, rnd(4000, 8000)); }
        else land();
      }
    } else if (st.mode === 'sit') {
      const p = perch(st.el, st.frac);
      if (p) place(st.x + (p.x - st.x) * 0.3, p.y, 0);         // sitzt mit, wenn sich der Platz bewegt
      else if (!reduced) next();                                // Platz weg (gescrollt, neu gezeichnet) → auffliegen
    }
    requestAnimationFrame(frame);
  }
  function setRunning(on) {
    if (on === running) return;
    running = on;
    if (on) requestAnimationFrame(frame); else stopSound(true);
  }
  bird.querySelector('.hit').addEventListener('click', ev => {
    ev.stopPropagation(); unlock();
    if (st.mode === 'sit' && !bird.classList.contains('singing')) sing();
  });
  document.addEventListener('visibilitychange', () => setRunning(birdShown && !document.hidden));

  function start() {
    layer.style.display = ''; btn.style.display = '';
    if (reduced) {                  // ohne Bewegung: sitzt ruhig auf dem Ton-Knopf und singt
      st.el = btn; st.frac = 0.5; st.mode = 'sit';
      const p0 = perch(btn, 0.5); if (p0) place(p0.x, p0.y, 0);
      bird.classList.add('sitting', 'ready');
      land = () => {}; next = () => {};
      setRunning(!document.hidden);
      later(sing, 1200);
      return;
    }
    flight = null; st.mode = 'away'; st.el = null;
    place(-120, 80, 0);
    bird.classList.add('ready');
    setRunning(!document.hidden);
    later(() => { const el = pick(); flyTo(el, rnd(0.25, 0.75)); }, 600);
  }
  function stop() {
    clearLater(); stopSound(true); setRunning(false);
    flight = null; st.mode = 'away';
    bird.classList.remove('sitting', 'singing', 'flying', 'peck', 'look', 'hopping', 'ready');
    layer.querySelectorAll('.bird-note').forEach(n => n.remove());
    layer.style.display = 'none'; btn.style.display = 'none';
  }
  birdCtl = on => { if (on) { unlock(); start(); } else stop(); };
  if (birdShown) start(); else { layer.style.display = 'none'; btn.style.display = 'none'; }
})();

/* ---------- Start ---------- */
(async function init() {
  if (state.view === 'favs' || state.view === 'settings' || state.view === 'climate') state.view = 'today';
  applyStatic();
  setTabs();
  importFromHash();
  const last = store.get('lastLoc', null);
  if (last && typeof last.lat === 'number') { loadLocation(last); return; }
  if (favs.length) { loadLocation(favs[0]); return; }
  renderHeader();
  const ok = await Promise.race([useGPS(true), new Promise(r => setTimeout(() => r(false), 15000))]);
  if (state.loc) return;
  if (!ok) { toast(tr('Kein GPS – zeige Berlin. Ort einfach oben suchen.', 'No GPS – showing Berlin. Just search for a place above.')); loadLocation({ name: 'Berlin', sub: tr('Berlin, Deutschland', 'Berlin, Germany'), lat: 52.52, lon: 13.405, cc: 'DE' }); }
})();
})();
</script>
